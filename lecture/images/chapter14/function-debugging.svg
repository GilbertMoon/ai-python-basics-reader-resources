<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">함수 오류 디버깅 체크리스트</title>
<desc id="desc">함수 호출 누락, 인수 개수 불일치, 지역 변수 범위, return 누락을 점검하는 Chapter 14 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:42px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:25px;font-weight:800}.b{font-size:19px;font-weight:600}.code{font-family:Consolas,monospace;font-size:20px;font-weight:700}.small{font-size:17px;font-weight:600}.n{font-size:21px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">함수 오류는 호출·인수·변수 범위·반환값부터 확인합니다</text>
<text x="70" y="135" class="s">함수 이름만 보지 말고 값이 들어오고 나가는 흐름을 한 단계씩 추적합니다</text>
<rect x="70" y="190" width="305" height="350" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<circle cx="115" cy="232" r="24" fill="#d85c5c"/><text x="115" y="239" text-anchor="middle" class="n">1</text><text x="155" y="240" class="h">호출했는가?</text>
<text x="100" y="305" class="code">def greet(): ...</text>
<text x="100" y="350" class="code">greet</text>
<text x="100" y="405" class="b">괄호가 없으면 실행되지 않음</text>
<text x="100" y="455" class="small">실제로 실행하려면 greet()</text>
<text x="100" y="485" class="small">형태인지 확인합니다.</text>
<rect x="400" y="190" width="305" height="350" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<circle cx="445" cy="232" r="24" fill="#d8a432"/><text x="445" y="239" text-anchor="middle" class="n">2</text><text x="485" y="240" class="h">인수 개수</text>
<text x="430" y="305" class="code">def add(a, b): ...</text>
<text x="430" y="350" class="code">add(10)</text>
<text x="430" y="405" class="b">→ TypeError 가능</text>
<text x="430" y="455" class="small">매개변수 개수와 전달한 인수</text>
<text x="430" y="485" class="small">개수를 맞춥니다.</text>
<rect x="730" y="190" width="305" height="350" rx="24" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<circle cx="775" cy="232" r="24" fill="#2f6ecb"/><text x="775" y="239" text-anchor="middle" class="n">3</text><text x="815" y="240" class="h">지역 변수</text>
<text x="760" y="305" class="code">def calc():</text><text x="780" y="345" class="code">total = 30</text>
<text x="760" y="405" class="code">print(total)</text>
<text x="760" y="455" class="small">함수 안에서 만든 변수는 보통</text>
<text x="760" y="485" class="small">함수 밖에서 직접 못 씁니다.</text>
<rect x="1060" y="190" width="305" height="350" rx="24" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<circle cx="1105" cy="232" r="24" fill="#2fa66d"/><text x="1105" y="239" text-anchor="middle" class="n">4</text><text x="1145" y="240" class="h">return 확인</text>
<text x="1090" y="305" class="code">def add(a, b):</text><text x="1110" y="345" class="code">a + b</text>
<text x="1090" y="405" class="code">result = add(1, 2)</text>
<text x="1090" y="455" class="small">반환하지 않으면 result에는</text>
<text x="1090" y="485" class="small">기대한 계산 결과가 없습니다.</text>
<rect x="70" y="600" width="1295" height="140" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="110" y="645" class="h">DEBUG CHECKLIST</text>
<text x="110" y="690" class="b">1. 함수 호출 괄호 · 2. 매개변수와 인수 개수 · 3. 지역 변수 범위 · 4. return 존재 여부 · 5. 한 번에 한 곳만 수정</text>
</svg>