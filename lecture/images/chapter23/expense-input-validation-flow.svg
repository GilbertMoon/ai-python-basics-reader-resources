<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">지출 입력 검증과 예외 처리 흐름</title>
<desc id="desc">날짜 카테고리 내용의 빈 값 검사와 금액 정수 변환 예외 처리, 0 이하 값 검증을 거쳐 지출 딕셔너리를 리스트에 추가하는 Chapter 23 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:600}.tag{font-size:17px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:15px;font-weight:700}</style>
<text x="70" y="88" class="t">잘못된 입력은 프로그램 전체를 끝내지 않고 현재 함수에서 안전하게 처리합니다</text>
<text x="70" y="132" class="s">예외 처리와 요구사항 검증을 구분하면 입력 흐름을 더 정확하게 이해할 수 있습니다</text>
<rect x="60" y="190" width="285" height="270" rx="25" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="95" y="220" width="125" height="38" rx="19" fill="#2f6ecb"/><text x="157" y="247" text-anchor="middle" class="tag">1. 문자열</text>
<text x="95" y="315" class="code">input(...).strip()</text>
<text x="95" y="355" class="small">date · category</text>
<text x="95" y="390" class="small">description 입력</text>
<text x="95" y="425" class="small">빈 문자열이면 안내 후 return</text>
<line x1="345" y1="325" x2="390" y2="325" stroke="#4775d1" stroke-width="5"/><polygon points="390,325 370,312 370,338" fill="#4775d1"/>
<rect x="390" y="190" width="300" height="270" rx="25" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="425" y="220" width="135" height="38" rx="19" fill="#d8a432"/><text x="492" y="247" text-anchor="middle" class="tag">2. 형 변환</text>
<text x="425" y="310" class="code">try:</text>
<text x="425" y="345" class="code">  amount = int(input(...))</text>
<text x="425" y="390" class="code">except ValueError:</text>
<text x="425" y="425" class="small">숫자가 아니면 안내 후 return</text>
<line x1="690" y1="325" x2="735" y2="325" stroke="#d8a432" stroke-width="5"/><polygon points="735,325 715,312 715,338" fill="#d8a432"/>
<rect x="735" y="190" width="300" height="270" rx="25" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="770" y="220" width="135" height="38" rx="19" fill="#d85c5c"/><text x="837" y="247" text-anchor="middle" class="tag">3. 값 검증</text>
<text x="770" y="315" class="code">if amount &lt;= 0:</text>
<text x="770" y="365" class="small">0원·음수는 문법 오류가 아님</text>
<text x="770" y="400" class="small">프로그램 요구사항에 맞지 않는 값</text>
<text x="770" y="435" class="small">안내 후 return</text>
<line x1="1035" y1="325" x2="1080" y2="325" stroke="#d85c5c" stroke-width="5"/><polygon points="1080,325 1060,312 1060,338" fill="#d85c5c"/>
<rect x="1080" y="190" width="300" height="270" rx="25" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="1115" y="220" width="135" height="38" rx="19" fill="#2fa66d"/><text x="1182" y="247" text-anchor="middle" class="tag">4. 추가</text>
<text x="1115" y="315" class="code">expense = {...}</text>
<text x="1115" y="365" class="code">expenses.append(</text>
<text x="1115" y="400" class="code">  expense)</text>
<text x="1115" y="435" class="small">정상 입력일 때만 리스트 변경</text>
<rect x="90" y="535" width="1260" height="165" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="580" class="h">예외 처리와 데이터 검증은 서로 다른 문제입니다</text>
<text x="130" y="630" class="b">예외</text><text x="230" y="630" class="small">"만원"을 int()로 바꾸려다 ValueError</text>
<text x="650" y="630" class="b">검증</text><text x="750" y="630" class="small">0, -1000처럼 변환은 되지만 허용하지 않는 값</text>
<text x="130" y="670" class="small">잘못된 경우 return으로 add_expense()만 종료하고 while 메뉴 반복은 계속 유지합니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">빈 값 확인 → int() 예외 처리 → 양수 검증 → 딕셔너리 생성 → 리스트에 추가</text>
</svg>