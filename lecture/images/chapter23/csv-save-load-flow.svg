<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">지출 데이터를 CSV로 저장하고 다시 불러오는 흐름</title>
<desc id="desc">지출 딕셔너리 리스트를 DictWriter로 CSV에 저장하고 DictReader로 다시 읽은 뒤 amount 문자열을 정수로 복원하는 Chapter 23 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:600}.tag{font-size:17px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:15px;font-weight:700}</style>
<text x="70" y="88" class="t">메모리의 지출 목록을 CSV에 저장하고 실행할 때 다시 복원합니다</text>
<text x="70" y="132" class="s">저장할 때는 딕셔너리 구조를 유지하고, 읽을 때 amount 자료형을 다시 정수로 바꿉니다</text>
<rect x="60" y="195" width="300" height="260" rx="25" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="95" y="225" width="125" height="38" rx="19" fill="#2f6ecb"/><text x="157" y="252" text-anchor="middle" class="tag">1. 메모리</text>
<text x="95" y="315" class="code">expenses = [</text>
<text x="95" y="350" class="code"> {date, category,</text>
<text x="95" y="385" class="code">  description, amount}</text>
<text x="95" y="420" class="code">]</text>
<line x1="360" y1="325" x2="405" y2="325" stroke="#4775d1" stroke-width="5"/><polygon points="405,325 385,312 385,338" fill="#4775d1"/>
<rect x="405" y="195" width="300" height="260" rx="25" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="440" y="225" width="125" height="38" rx="19" fill="#d8a432"/><text x="502" y="252" text-anchor="middle" class="tag">2. 저장</text>
<text x="440" y="305" class="code">csv.DictWriter(...)</text>
<text x="440" y="340" class="code">writeheader()</text>
<text x="440" y="375" class="code">writerows(expenses)</text>
<text x="440" y="420" class="small">w 모드로 전체 목록 다시 저장</text>
<line x1="705" y1="325" x2="750" y2="325" stroke="#d8a432" stroke-width="5"/><polygon points="750,325 730,312 730,338" fill="#d8a432"/>
<rect x="750" y="195" width="300" height="260" rx="25" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="785" y="225" width="125" height="38" rx="19" fill="#7d64bd"/><text x="847" y="252" text-anchor="middle" class="tag">3. CSV</text>
<text x="785" y="315" class="code">expenses.csv</text>
<text x="785" y="360" class="small">date, category,</text>
<text x="785" y="395" class="small">description, amount</text>
<text x="785" y="430" class="small">UTF-8-SIG + newline=""</text>
<line x1="1050" y1="325" x2="1095" y2="325" stroke="#7d64bd" stroke-width="5"/><polygon points="1095,325 1075,312 1075,338" fill="#7d64bd"/>
<rect x="1095" y="195" width="285" height="260" rx="25" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="1130" y="225" width="125" height="38" rx="19" fill="#2fa66d"/><text x="1192" y="252" text-anchor="middle" class="tag">4. 복원</text>
<text x="1130" y="305" class="code">csv.DictReader(...)</text>
<text x="1130" y="345" class="code">row["amount"] =</text>
<text x="1130" y="380" class="code"> int(row["amount"])</text>
<text x="1130" y="425" class="small">정상 행만 리스트에 append</text>
<rect x="90" y="525" width="1260" height="175" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="570" class="h">불러오기에서는 두 상황을 따로 처리합니다</text>
<text x="130" y="620" class="b">파일 없음</text><text x="250" y="620" class="small">첫 실행이라면 FileNotFoundError → 빈 리스트 []로 시작</text>
<text x="130" y="665" class="b">금액 손상</text><text x="250" y="665" class="small">int() ValueError → 해당 행만 건너뛰고 나머지는 계속 읽기</text>
<text x="785" y="620" class="b">검증</text><text x="885" y="620" class="small">저장 전 목록과 다시 읽은 목록의 내용 비교</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">리스트 → DictWriter → CSV → DictReader → amount 정수 복원 → 리스트</text>
</svg>