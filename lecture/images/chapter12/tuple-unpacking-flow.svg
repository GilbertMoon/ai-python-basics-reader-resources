<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">튜플 패킹과 언패킹 흐름</title>
<desc id="desc">여러 값을 하나의 튜플로 묶는 패킹과 여러 변수로 나누는 언패킹, 변수 개수와 값 개수 일치 규칙을 설명하는 Chapter 12 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:56px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:25px;font-weight:700}.small{font-size:19px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">패킹은 묶고, 언패킹은 여러 변수로 나눕니다</text>
<text x="70" y="135" class="s">튜플은 여러 값을 한 번에 전달하고 다시 나누어 받을 때 편리합니다</text>
<rect x="80" y="205" width="455" height="175" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="115" y="230" width="105" height="38" rx="19" fill="#2f6ecb"/><text x="167" y="257" text-anchor="middle" class="tag">패킹</text>
<text x="115" y="315" class="code">student = ("문길동", 20, "Python")</text>
<text x="115" y="355" class="small">여러 값을 하나의 튜플 변수에 저장</text>
<line x1="535" y1="290" x2="640" y2="290" stroke="#4775d1" stroke-width="5"/><polygon points="640,290 620,277 620,303" fill="#4775d1"/>
<rect x="640" y="205" width="720" height="175" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="675" y="230" width="125" height="38" rx="19" fill="#2fa66d"/><text x="737" y="257" text-anchor="middle" class="tag">언패킹</text>
<text x="675" y="315" class="code">name, age, language = student</text>
<text x="675" y="355" class="small">튜플의 각 값을 왼쪽 변수에 순서대로 나누어 저장</text>
<rect x="110" y="465" width="350" height="120" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="285" y="510" text-anchor="middle" class="h">name</text><text x="285" y="555" text-anchor="middle" class="code">"문길동"</text>
<rect x="545" y="465" width="350" height="120" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="720" y="510" text-anchor="middle" class="h">age</text><text x="720" y="555" text-anchor="middle" class="code">20</text>
<rect x="980" y="465" width="350" height="120" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="1155" y="510" text-anchor="middle" class="h">language</text><text x="1155" y="555" text-anchor="middle" class="code">"Python"</text>
<rect x="80" y="650" width="1280" height="105" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="2"/>
<text x="120" y="695" class="h">주의: 변수 개수와 값 개수는 맞아야 합니다</text>
<text x="120" y="735" class="code">name, age = ("문길동", 20, "Python")</text>
<text x="870" y="735" class="b">→ ValueError</text>
</svg>