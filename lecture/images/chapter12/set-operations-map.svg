<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">집합의 중복 제거와 집합 연산</title>
<desc id="desc">집합의 중복 제거 특징과 합집합 교집합 차집합 연산을 설명하는 Chapter 12 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:21px;font-weight:600}.code{font-family:Consolas,monospace;font-size:24px;font-weight:700}.tag{font-size:20px;font-weight:800;fill:#fff}.small{font-size:18px;font-weight:600}</style>
<text x="70" y="90" class="t">집합은 중복을 제거하고 두 데이터 묶음을 비교하기 좋습니다</text>
<text x="70" y="135" class="s">순서보다 고유한 값과 포함 관계가 중요할 때 사용합니다</text>
<rect x="70" y="190" width="1300" height="145" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<text x="110" y="238" class="h">중복 제거</text>
<text x="110" y="290" class="code">{"Python", "AI", "Python", "Data"}</text>
<text x="770" y="290" class="b">→ 중복된 "Python"은 하나만 남습니다</text>
<rect x="70" y="390" width="400" height="270" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="105" y="420" width="120" height="38" rx="19" fill="#2fa66d"/><text x="165" y="447" text-anchor="middle" class="tag">합집합</text>
<text x="105" y="520" class="code">A | B</text>
<text x="105" y="570" class="b">두 집합의 모든 고유한 값</text>
<text x="105" y="615" class="small">A.union(B)와 같은 의미</text>
<rect x="520" y="390" width="400" height="270" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="555" y="420" width="120" height="38" rx="19" fill="#d8a432"/><text x="615" y="447" text-anchor="middle" class="tag">교집합</text>
<text x="555" y="520" class="code">A &amp; B</text>
<text x="555" y="570" class="b">두 집합에 공통으로 있는 값</text>
<text x="555" y="615" class="small">A.intersection(B)와 같은 의미</text>
<rect x="970" y="390" width="400" height="270" rx="26" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="1005" y="420" width="120" height="38" rx="19" fill="#d85c5c"/><text x="1065" y="447" text-anchor="middle" class="tag">차집합</text>
<text x="1005" y="520" class="code">A - B</text>
<text x="1005" y="570" class="b">A에만 있고 B에는 없는 값</text>
<text x="1005" y="615" class="small">A.difference(B)와 같은 의미</text>
<rect x="70" y="710" width="1300" height="65" rx="20" fill="#f7f9fc"/>
<text x="720" y="751" text-anchor="middle" class="b">빈 집합은 {}가 아니라 set()으로 만듭니다 · 집합은 인덱스 순서에 의존하지 않습니다</text>
</svg>