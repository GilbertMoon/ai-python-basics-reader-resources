<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">리스트와 튜플 비교</title>
<desc id="desc">리스트와 튜플의 공통점과 차이, 튜플 요소 변경 불가와 요소가 하나인 튜플의 쉼표 규칙을 설명하는 Chapter 12 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:26px;font-weight:700}.small{font-size:19px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">리스트와 튜플은 모두 순서가 있지만 변경 가능 여부가 다릅니다</text>
<text x="70" y="135" class="s">데이터가 계속 바뀔지, 만든 뒤 그대로 둘지를 기준으로 선택합니다</text>
<rect x="70" y="195" width="620" height="385" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="110" y="225" width="120" height="40" rx="20" fill="#2f6ecb"/><text x="170" y="253" text-anchor="middle" class="tag">리스트 [ ]</text>
<text x="110" y="325" class="code">colors = ["red", "green"]</text>
<text x="110" y="385" class="h">순서 있음 · 수정 가능</text>
<text x="110" y="440" class="b">값 추가·삭제·수정이 자주 필요한 데이터</text>
<text x="110" y="500" class="code">colors[0] = "black"</text>
<text x="110" y="545" class="small">→ 정상적으로 값이 바뀝니다.</text>
<rect x="750" y="195" width="620" height="385" rx="28" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="790" y="225" width="120" height="40" rx="20" fill="#2fa66d"/><text x="850" y="253" text-anchor="middle" class="tag">튜플 ( )</text>
<text x="790" y="325" class="code">colors = ("red", "green")</text>
<text x="790" y="385" class="h">순서 있음 · 요소 변경 불가</text>
<text x="790" y="440" class="b">좌표·RGB처럼 고정된 조합에 적합</text>
<text x="790" y="500" class="code">colors[0] = "black"</text>
<text x="790" y="545" class="small">→ TypeError가 발생합니다.</text>
<rect x="70" y="630" width="1300" height="115" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="2"/>
<text x="110" y="675" class="h">요소가 하나인 튜플은 쉼표가 핵심</text>
<text x="110" y="720" class="code">(10,) → tuple</text>
<text x="470" y="720" class="code">(10) → int</text>
<text x="820" y="720" class="b">튜플을 만드는 핵심은 괄호보다 쉼표입니다.</text>
</svg>