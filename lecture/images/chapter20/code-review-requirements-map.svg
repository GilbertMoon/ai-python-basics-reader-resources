<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">AI 코드 실행 전 검토와 요구사항 대조</title>
<desc id="desc">AI가 만든 코드를 실행하기 전에 입력 처리 출력 낯선 문법을 읽고 요구사항과 코드 조건을 대조하는 Chapter 20 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:25px;font-weight:800}.b{font-size:18px;font-weight:600}.code{font-family:Consolas,monospace;font-size:18px;font-weight:700}.small{font-size:15px;font-weight:600}.tag{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">AI가 만든 코드는 실행 전에 읽고 요구사항과 대조합니다</text>
<text x="70" y="132" class="s">“실행된다”와 “처음 정한 조건대로 동작한다”는 서로 다른 검증입니다</text>
<rect x="70" y="190" width="620" height="330" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="220" width="145" height="38" rx="19" fill="#2f6ecb"/><text x="178" y="247" text-anchor="middle" class="tag">실행 전 읽기</text>
<text x="105" y="315" class="h">코드에서 네 가지를 찾습니다</text>
<text x="105" y="370" class="b">1. 입력</text><text x="230" y="370" class="small">어떤 값을 받고 어떤 형으로 바꾸는가?</text>
<text x="105" y="410" class="b">2. 처리</text><text x="230" y="410" class="small">조건·계산·반복은 무엇인가?</text>
<text x="105" y="450" class="b">3. 출력</text><text x="230" y="450" class="small">무엇을 화면·파일에 내보내는가?</text>
<text x="105" y="490" class="b">4. 낯선 코드</text><text x="230" y="490" class="small">배우지 않은 문법·모듈·외부 영향은 없는가?</text>
<rect x="750" y="190" width="620" height="330" rx="28" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="785" y="220" width="165" height="38" rx="19" fill="#d8a432"/><text x="868" y="247" text-anchor="middle" class="tag">요구사항 대조</text>
<text x="785" y="315" class="h">배송비 규칙을 코드와 비교합니다</text>
<text x="785" y="365" class="b">요구사항</text><text x="920" y="365" class="small">50,000원 이상 → 배송비 0원</text>
<text x="785" y="420" class="b">AI 코드</text><text x="920" y="420" class="code">if order_amount &gt; 50000:</text>
<text x="785" y="475" class="b">차이</text><text x="920" y="475" class="small">50,000원 자체가 무료 배송에서 빠짐</text>
<rect x="90" y="585" width="1260" height="140" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="630" class="h">논리 오류는 오류 메시지가 없을 수 있습니다</text>
<text x="130" y="675" class="b">요구사항 문장 ↔ 조건식 ↔ 계산식 ↔ 반환값을 한 항목씩 비교해야 발견할 수 있습니다</text>
<text x="130" y="710" class="small">파일 삭제·덮어쓰기, 패키지 설치, 네트워크 사용처럼 프로그램 밖에 영향을 주는 코드도 실행 전에 역할을 확인합니다</text>
<rect x="90" y="755" width="1260" height="35" rx="14" fill="#eef5ff"/>
<text x="720" y="779" text-anchor="middle" class="b">AI 코드 = 완성품이 아니라 사람이 읽고 검증할 초안</text>
</svg>