<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">오류 재현부터 최소 수정과 재검증까지</title>
<desc id="desc">문제 입력을 재현하고 작은 함수로 범위를 좁힌 뒤 코드 입력 실제 결과 예상 결과를 AI에 전달하고 최소 수정 후 다시 테스트하는 Chapter 20 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:18px;font-weight:600}.small{font-size:15px;font-weight:600}.tag{font-size:18px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:17px;font-weight:700}</style>
<text x="70" y="88" class="t">문제를 재현하고 범위를 줄인 뒤 원인만 최소한으로 수정합니다</text>
<text x="70" y="132" class="s">한 번에 전체 코드를 바꾸지 않아야 무엇이 문제를 해결했는지 알 수 있습니다</text>
<rect x="60" y="195" width="300" height="235" rx="25" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="95" y="225" width="110" height="38" rx="19" fill="#2f6ecb"/><text x="150" y="252" text-anchor="middle" class="tag">1. 재현</text>
<text x="95" y="315" class="b">입력</text><text x="170" y="315" class="code">50000</text>
<text x="95" y="355" class="b">실제</text><text x="170" y="355" class="code">3000</text>
<text x="95" y="395" class="b">예상</text><text x="170" y="395" class="code">0</text>
<line x1="360" y1="310" x2="405" y2="310" stroke="#4775d1" stroke-width="5"/><polygon points="405,310 385,297 385,323" fill="#4775d1"/>
<rect x="405" y="195" width="300" height="235" rx="25" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="440" y="225" width="120" height="38" rx="19" fill="#d8a432"/><text x="500" y="252" text-anchor="middle" class="tag">2. 축소</text>
<text x="440" y="315" class="h">문제 함수만 실행</text>
<text x="440" y="360" class="code">calculate_shipping(50000)</text>
<text x="440" y="405" class="small">입력·할인·출력 등 주변 코드는 제외</text>
<line x1="705" y1="310" x2="750" y2="310" stroke="#d8a432" stroke-width="5"/><polygon points="750,310 730,297 730,323" fill="#d8a432"/>
<rect x="750" y="195" width="300" height="235" rx="25" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="785" y="225" width="120" height="38" rx="19" fill="#2fa66d"/><text x="845" y="252" text-anchor="middle" class="tag">3. 질문</text>
<text x="785" y="310" class="b">AI에 함께 제공</text>
<text x="785" y="350" class="small">현재 코드 · 문제 입력</text>
<text x="785" y="385" class="small">실제 결과 · 예상 결과</text>
<text x="785" y="415" class="small">원인 설명과 최소 수정 위치 요청</text>
<line x1="1050" y1="310" x2="1095" y2="310" stroke="#2fa66d" stroke-width="5"/><polygon points="1095,310 1075,297 1075,323" fill="#2fa66d"/>
<rect x="1095" y="195" width="285" height="235" rx="25" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="1130" y="225" width="130" height="38" rx="19" fill="#7d64bd"/><text x="1195" y="252" text-anchor="middle" class="tag">4. 최소 수정</text>
<text x="1130" y="325" class="code">&gt; 50000</text>
<text x="1210" y="365" text-anchor="middle" class="h">↓</text>
<text x="1130" y="405" class="code">&gt;= 50000</text>
<rect x="90" y="510" width="1260" height="190" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="555" class="h">수정 후에는 실패했던 값뿐 아니라 이전 정상값도 다시 테스트합니다</text>
<text x="130" y="610" class="code">40000 → 3000</text><text x="420" y="610" class="code">49999 → 3000</text><text x="720" y="610" class="code">50000 → 0</text><text x="980" y="610" class="code">50001 → 0</text>
<text x="130" y="660" class="small">수정으로 기존 정상 동작이 깨지지 않았는지 확인하는 것이 재검증의 핵심입니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">재현 → 범위 축소 → 정보와 함께 질문 → 최소 수정 → 전체 테스트 다시 실행</text>
</svg>