<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">AI 코드 검증 디버깅 개선 체크리스트</title>
<desc id="desc">코드 읽기 요구사항 비교 경계값 테스트 재현 AI 질문 최소 수정 재검증 개선과 AI 수정안 재검증을 정리한 Chapter 20 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:38px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:23px;font-weight:800}.b{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:600}.n{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">AI 코드도 읽고·테스트하고·수정하고·다시 검증해야 합니다</text>
<text x="70" y="132" class="s">정확성을 먼저 확인하고 그다음 읽기 쉬운 코드로 개선합니다</text>
<rect x="60" y="190" width="310" height="210" rx="24" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<circle cx="100" cy="230" r="22" fill="#2f6ecb"/><text x="100" y="237" text-anchor="middle" class="n">1</text><text x="140" y="238" class="h">읽기</text>
<text x="95" y="300" class="b">입력 · 처리 · 출력</text>
<text x="95" y="335" class="small">낯선 문법과 외부 영향 확인</text>
<text x="95" y="370" class="small">이해하지 못한 코드는 먼저 질문</text>
<rect x="395" y="190" width="310" height="210" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<circle cx="435" cy="230" r="22" fill="#d8a432"/><text x="435" y="237" text-anchor="middle" class="n">2</text><text x="475" y="238" class="h">비교·테스트</text>
<text x="430" y="300" class="b">요구사항 ↔ 코드</text>
<text x="430" y="335" class="small">정상값 · 경계값 · 비정상값</text>
<text x="430" y="370" class="small">예상 결과와 실제 결과 비교</text>
<rect x="730" y="190" width="310" height="210" rx="24" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<circle cx="770" cy="230" r="22" fill="#2fa66d"/><text x="770" y="237" text-anchor="middle" class="n">3</text><text x="810" y="238" class="h">재현·질문</text>
<text x="765" y="300" class="b">문제 입력을 다시 실행</text>
<text x="765" y="335" class="small">문제 범위를 작은 함수로 축소</text>
<text x="765" y="370" class="small">코드·입력·실제·예상을 함께 제공</text>
<rect x="1065" y="190" width="315" height="210" rx="24" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<circle cx="1105" cy="230" r="22" fill="#7d64bd"/><text x="1105" y="237" text-anchor="middle" class="n">4</text><text x="1145" y="238" class="h">최소 수정</text>
<text x="1100" y="300" class="b">원인과 관련된 부분만 변경</text>
<text x="1100" y="335" class="small">전체 재작성은 피하기</text>
<text x="1100" y="370" class="small">무엇이 문제를 해결했는지 확인</text>
<rect x="120" y="485" width="570" height="190" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="160" y="530" class="h">5. 재검증</text>
<text x="160" y="575" class="b">실패했던 입력 + 이전 정상값을 모두 다시 실행</text>
<text x="160" y="615" class="small">AI가 제안한 수정도 자동으로 정답이라고 가정하지 않음</text>
<text x="160" y="650" class="small">버전이 달라질 수 있는 API·라이브러리는 현재 환경과 공식 문서도 확인</text>
<rect x="750" y="485" width="570" height="190" rx="26" fill="#eef5ff" stroke="#c7ddf8" stroke-width="2"/>
<text x="790" y="530" class="h">6. 정확한 뒤 개선</text>
<text x="790" y="575" class="b">이름 · 중복 · 함수 역할 · 불필요한 복잡성 개선</text>
<text x="790" y="615" class="small">동작과 출력 형식을 유지한다는 조건을 AI에게 명시</text>
<text x="790" y="650" class="small">개선 전후의 테스트 결과가 같은지 다시 확인</text>
<rect x="90" y="735" width="1260" height="45" rx="16" fill="#eef5ff"/>
<text x="720" y="765" text-anchor="middle" class="b">읽기 → 비교 → 테스트 → 재현 → 최소 수정 → 재검증 → 개선 → 다시 검증</text>
</svg>