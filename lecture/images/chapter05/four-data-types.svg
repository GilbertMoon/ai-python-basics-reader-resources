<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">파이썬의 네 가지 기본 데이터형</title><desc id="desc">int float str bool의 의미와 예제를 비교하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:34px;font-weight:800}.b{font-size:24px;font-weight:600}.code{font-family:Consolas,monospace;font-size:32px;font-weight:700}</style>
<text x="720" y="80" text-anchor="middle" class="t">파이썬의 네 가지 기본 데이터형</text><text x="720" y="125" text-anchor="middle" class="s">화면에 보이는 값이 비슷해도 파이썬은 값의 종류를 구분합니다</text>
<g transform="translate(80,200)"><rect width="280" height="390" rx="28" fill="#eef4ff" stroke="#7ea8ef" stroke-width="3"/><text x="140" y="75" text-anchor="middle" class="h">int</text><text x="140" y="125" text-anchor="middle" class="b">정수</text><text x="140" y="210" text-anchor="middle" class="code">10</text><text x="140" y="265" text-anchor="middle" class="code">-3</text><text x="140" y="320" text-anchor="middle" class="code">2026</text><text x="140" y="365" text-anchor="middle" class="b">소수점 없음</text></g>
<g transform="translate(410,200)"><rect width="280" height="390" rx="28" fill="#eaf8f4" stroke="#63beb5" stroke-width="3"/><text x="140" y="75" text-anchor="middle" class="h">float</text><text x="140" y="125" text-anchor="middle" class="b">실수</text><text x="140" y="210" text-anchor="middle" class="code">3.14</text><text x="140" y="265" text-anchor="middle" class="code">-0.5</text><text x="140" y="320" text-anchor="middle" class="code">180.0</text><text x="140" y="365" text-anchor="middle" class="b">소수점 포함</text></g>
<g transform="translate(740,200)"><rect width="280" height="390" rx="28" fill="#fff3e9" stroke="#e5ad70" stroke-width="3"/><text x="140" y="75" text-anchor="middle" class="h">str</text><text x="140" y="125" text-anchor="middle" class="b">문자열</text><text x="140" y="210" text-anchor="middle" class="code">"Python"</text><text x="140" y="265" text-anchor="middle" class="code">"20"</text><text x="140" y="320" text-anchor="middle" class="code">"서울"</text><text x="140" y="365" text-anchor="middle" class="b">따옴표로 감싼 글자</text></g>
<g transform="translate(1070,200)"><rect width="280" height="390" rx="28" fill="#f3efff" stroke="#9e87df" stroke-width="3"/><text x="140" y="75" text-anchor="middle" class="h">bool</text><text x="140" y="125" text-anchor="middle" class="b">논리값</text><text x="140" y="225" text-anchor="middle" class="code">True</text><text x="140" y="300" text-anchor="middle" class="code">False</text><text x="140" y="365" text-anchor="middle" class="b">참 / 거짓</text></g>
<rect x="270" y="640" width="900" height="90" rx="20" fill="#f6f9ff" stroke="#bfd0f7"/><text x="720" y="695" text-anchor="middle" class="h">type()으로 예상한 데이터형과 실제 데이터형을 직접 확인합니다</text>
</svg>