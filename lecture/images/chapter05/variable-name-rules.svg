<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">좋은 변수 이름 만들기</title><desc id="desc">올바른 변수 이름과 잘못된 변수 이름, snake_case 규칙을 비교하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:34px;font-weight:800}.b{font-size:24px;font-weight:600}.code{font-family:Consolas,monospace;font-size:30px;font-weight:700}.ok{fill:#0d8f89}.bad{fill:#c83f4b}</style>
<text x="720" y="80" text-anchor="middle" class="t">변수 이름은 실행보다 ‘읽기 쉬움’까지 생각합니다</text><text x="720" y="125" text-anchor="middle" class="s">규칙을 지키고, 나중에 다시 봐도 의미가 드러나는 이름을 사용합니다</text>
<rect x="90" y="185" width="580" height="420" rx="30" fill="#edf9f5" stroke="#63beb5" stroke-width="3"/><text x="380" y="240" text-anchor="middle" class="h ok">사용하기 좋은 이름</text><text x="170" y="315" class="code">name</text><text x="170" y="370" class="code">student_name</text><text x="170" y="425" class="code">score2</text><text x="170" y="480" class="code">total_price</text><text x="170" y="550" class="b">✓ 영문자·숫자·밑줄 사용</text><text x="170" y="585" class="b">✓ 의미가 드러나는 이름</text>
<rect x="770" y="185" width="580" height="420" rx="30" fill="#fff1f2" stroke="#e7a0a7" stroke-width="3"/><text x="1060" y="240" text-anchor="middle" class="h bad">피해야 할 이름</text><text x="850" y="315" class="code">1score</text><text x="1130" y="315" class="b">숫자로 시작</text><text x="850" y="370" class="code">student-name</text><text x="1130" y="370" class="b">- 사용</text><text x="850" y="425" class="code">total price</text><text x="1130" y="425" class="b">공백 포함</text><text x="850" y="480" class="code">class</text><text x="1130" y="480" class="b">예약어</text><text x="850" y="550" class="b">✗ 실행 오류 또는 의미 혼란</text><text x="850" y="585" class="b">✗ a, b처럼 뜻이 안 보이는 이름 남용</text>
<rect x="240" y="645" width="960" height="90" rx="22" fill="#f6f9ff" stroke="#bfd0f7"/><text x="720" y="690" text-anchor="middle" class="h">snake_case 예: student_name · total_price · order_count</text>
<text x="720" y="765" text-anchor="middle" class="b">핵심: 컴퓨터가 읽는 이름이면서 동시에 사람이 다시 이해할 수 있는 이름이어야 합니다</text>
</svg>