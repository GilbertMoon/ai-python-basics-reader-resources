<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">데이터형 변환 흐름</title><desc id="desc">int float str bool을 이용한 기본 형 변환과 변환 오류를 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:30px;font-weight:800}.b{font-size:23px;font-weight:600}.code{font-family:Consolas,monospace;font-size:30px;font-weight:700}.err{fill:#c83f4b;font-size:25px;font-weight:800}</style>
<text x="720" y="80" text-anchor="middle" class="t">필요하면 데이터형을 바꿀 수 있습니다</text><text x="720" y="125" text-anchor="middle" class="s">변환 함수는 값의 표현 방식을 바꾸지만, 모든 값이 원하는 형으로 바뀌는 것은 아닙니다</text>
<g transform="translate(90,210)"><rect width="280" height="250" rx="26" fill="#eef4ff" stroke="#7ea8ef" stroke-width="3"/><text x="140" y="55" text-anchor="middle" class="h">int()</text><text x="140" y="120" text-anchor="middle" class="code">"20"</text><text x="140" y="165" text-anchor="middle" class="b">↓</text><text x="140" y="215" text-anchor="middle" class="code">20</text></g>
<g transform="translate(410,210)"><rect width="280" height="250" rx="26" fill="#eaf8f4" stroke="#63beb5" stroke-width="3"/><text x="140" y="55" text-anchor="middle" class="h">float()</text><text x="140" y="120" text-anchor="middle" class="code">"12.5"</text><text x="140" y="165" text-anchor="middle" class="b">↓</text><text x="140" y="215" text-anchor="middle" class="code">12.5</text></g>
<g transform="translate(730,210)"><rect width="280" height="250" rx="26" fill="#fff3e9" stroke="#e5ad70" stroke-width="3"/><text x="140" y="55" text-anchor="middle" class="h">str()</text><text x="140" y="120" text-anchor="middle" class="code">2026</text><text x="140" y="165" text-anchor="middle" class="b">↓</text><text x="140" y="215" text-anchor="middle" class="code">"2026"</text></g>
<g transform="translate(1050,210)"><rect width="280" height="250" rx="26" fill="#f3efff" stroke="#9e87df" stroke-width="3"/><text x="140" y="55" text-anchor="middle" class="h">bool()</text><text x="140" y="105" text-anchor="middle" class="code">1 → True</text><text x="140" y="165" text-anchor="middle" class="code">0 → False</text><text x="140" y="215" text-anchor="middle" class="b">참 / 거짓으로 해석</text></g>
<rect x="130" y="520" width="1180" height="150" rx="26" fill="#fff0f1" stroke="#e7a0a7" stroke-width="3"/><text x="720" y="565" text-anchor="middle" class="h">변환할 수 없는 값은 오류가 날 수 있습니다</text><text x="720" y="620" text-anchor="middle" class="code">int("Python")</text><text x="720" y="660" text-anchor="middle" class="err">ValueError — 정수로 해석할 수 없는 문자열</text>
<text x="720" y="750" text-anchor="middle" class="h">핵심: 변환 전에 “이 값이 정말 원하는 데이터형으로 해석 가능한가?”를 먼저 생각합니다</text>
</svg>