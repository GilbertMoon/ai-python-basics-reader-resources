<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">변수는 값에 붙는 이름표</title><desc id="desc">파이썬 변수 이름이 값을 가리키고 값 변경 시 새 값을 가리키는 개념을 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:32px;font-weight:800}.b{font-size:25px;font-weight:600}.code{font-family:Consolas,monospace;font-size:38px;font-weight:700}.n{font-size:26px;font-weight:800;fill:#fff}</style>
<text x="720" y="80" text-anchor="middle" class="t">변수는 값에 붙는 이름표</text><text x="720" y="125" text-anchor="middle" class="s">변수 이름으로 값을 다시 사용하고, 필요하면 새 값으로 바꿀 수 있습니다</text>
<rect x="90" y="190" width="1260" height="500" rx="34" fill="#f6f9ff" stroke="#bfd0f7" stroke-width="3"/>
<rect x="160" y="285" width="260" height="110" rx="22" fill="#2364d8"/><text x="290" y="350" text-anchor="middle" class="code" fill="#fff">age</text><text x="290" y="430" text-anchor="middle" class="b">변수 이름</text>
<path d="M440 340 H620" stroke="#0d8f89" stroke-width="12"/><path d="M620 340 l-35 -22 v44 z" fill="#0d8f89"/>
<rect x="650" y="275" width="220" height="130" rx="22" fill="#e8f7f4" stroke="#63beb5" stroke-width="3"/><text x="760" y="350" text-anchor="middle" class="code">20</text><text x="760" y="440" text-anchor="middle" class="b">현재 값</text>
<text x="1010" y="250" text-anchor="middle" class="h">값을 바꾸면?</text><text x="1010" y="310" text-anchor="middle" class="code">age = 20</text><text x="1010" y="365" text-anchor="middle" class="code">age = 25</text><path d="M930 420 H1090" stroke="#2364d8" stroke-width="9"/><path d="M1090 420 l-30 -18 v36 z" fill="#2364d8"/><rect x="920" y="460" width="180" height="110" rx="20" fill="#e8f7f4" stroke="#63beb5" stroke-width="3"/><text x="1010" y="530" text-anchor="middle" class="code">25</text>
<rect x="170" y="560" width="620" height="80" rx="18" fill="#fff4da"/><text x="480" y="610" text-anchor="middle" class="b">= 는 “같다”가 아니라 값을 변수에 대입하는 기호</text>
<text x="720" y="750" text-anchor="middle" class="h">핵심: 변수는 값을 외우게 하는 상자보다, 값을 다시 찾게 해 주는 이름표에 가깝습니다</text>
</svg>