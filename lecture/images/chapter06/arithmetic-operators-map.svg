<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">산술 연산자 한눈에 보기</title><desc id="desc">파이썬 산술 연산자 더하기 빼기 곱하기 나누기 몫 나머지 거듭제곱을 정리한 인포그래픽</desc><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.op{font-family:Consolas,monospace;font-size:46px;font-weight:800;fill:#2364d8}.h{font-size:28px;font-weight:800}.b{font-size:22px;font-weight:600}.r{font-family:Consolas,monospace;font-size:23px;font-weight:700;fill:#0b735f}</style><text x="720" y="78" text-anchor="middle" class="t">산술 연산자 한눈에 보기</text><text x="720" y="122" text-anchor="middle" class="s">계산하기 전에 의미와 결과를 먼저 예상합니다</text><g transform="translate(70,185)"><rect width="170" height="220" rx="22" fill="#edf4ff" stroke="#b9d1ff"/><text x="85" y="65" text-anchor="middle" class="op">+</text><text x="85" y="110" text-anchor="middle" class="h">더하기</text><text x="85" y="155" text-anchor="middle" class="b">10 + 3</text><text x="85" y="192" text-anchor="middle" class="r">13</text></g><g transform="translate(255,185)"><rect width="170" height="220" rx="22" fill="#f3f7ff" stroke="#c8d5f2"/><text x="85" y="65" text-anchor="middle" class="op">−</text><text x="85" y="110" text-anchor="middle" class="h">빼기</text><text x="85" y="155" text-anchor="middle" class="b">10 - 3</text><text x="85" y="192" text-anchor="middle" class="r">7</text></g><g transform="translate(440,185)"><rect width="170" height="220" rx="22" fill="#eefaf7" stroke="#bfe1d7"/><text x="85" y="65" text-anchor="middle" class="op">*</text><text x="85" y="110" text-anchor="middle" class="h">곱하기</text><text x="85" y="155" text-anchor="middle" class="b">10 * 3</text><text x="85" y="192" text-anchor="middle" class="r">30</text></g><g transform="translate(625,185)"><rect width="170" height="220" rx="22" fill="#fff8eb" stroke="#ead3a1"/><text x="85" y="65" text-anchor="middle" class="op">/</text><text x="85" y="110" text-anchor="middle" class="h">나누기</text><text x="85" y="155" text-anchor="middle" class="b">10 / 3</text><text x="85" y="192" text-anchor="middle" class="r">3.333...</text></g><g transform="translate(810,185)"><rect width="170" height="220" rx="22" fill="#f3efff" stroke="#d5c6fa"/><text x="85" y="65" text-anchor="middle" class="op">//</text><text x="85" y="110" text-anchor="middle" class="h">몫</text><text x="85" y="155" text-anchor="middle" class="b">17 // 5</text><text x="85" y="192" text-anchor="middle" class="r">3</text></g><g transform="translate(995,185)"><rect width="170" height="220" rx="22" fill="#fff1f1" stroke="#efcaca"/><text x="85" y="65" text-anchor="middle" class="op">%</text><text x="85" y="110" text-anchor="middle" class="h">나머지</text><text x="85" y="155" text-anchor="middle" class="b">17 % 5</text><text x="85" y="192" text-anchor="middle" class="r">2</text></g><g transform="translate(1180,185)"><rect width="170" height="220" rx="22" fill="#eef8ff" stroke="#c3dfee"/><text x="85" y="65" text-anchor="middle" class="op">**</text><text x="85" y="110" text-anchor="middle" class="h">거듭제곱</text><text x="85" y="155" text-anchor="middle" class="b">2 ** 3</text><text x="85" y="192" text-anchor="middle" class="r">8</text></g><rect x="115" y="475" width="1210" height="220" rx="30" fill="#f7faff" stroke="#cbd8ee"/><text x="165" y="530" class="h">실전 예: 125분을 시간과 분으로 나누기</text><text x="165" y="588" class="b">hours = 125 // 60</text><text x="165" y="632" class="b">minutes = 125 % 60</text><text x="900" y="590" class="h">결과</text><text x="900" y="640" class="r">2시간 5분</text><text x="720" y="755" text-anchor="middle" class="s">// 는 큰 단위의 개수, % 는 남은 값을 구할 때 함께 자주 사용합니다.</text></svg>