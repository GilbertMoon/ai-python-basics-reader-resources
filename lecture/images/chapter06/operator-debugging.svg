<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">연산 오류를 읽는 기본 순서</title><desc id="desc">ZeroDivisionError TypeError와 대입 비교 혼동을 관찰하고 최소 수정하는 디버깅 흐름</desc><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:23px;font-weight:700}.err{fill:#b84848}.ok{fill:#0b7f6b}.n{font-size:25px;font-weight:800;fill:#fff}</style><text x="720" y="78" text-anchor="middle" class="t">연산 오류도 학습 재료입니다</text><text x="720" y="122" text-anchor="middle" class="s">오류 이름을 외우기보다 코드 · 메시지 · 데이터형을 연결해 봅니다</text><g transform="translate(70,180)"><rect width="390" height="280" rx="26" fill="#fff2f2" stroke="#efc9c9"/><text x="195" y="50" text-anchor="middle" class="h">0으로 나누기</text><text x="35" y="105" class="code">print(10 / 0)</text><text x="35" y="165" class="code err">ZeroDivisionError</text><text x="35" y="215" class="b">숫자를 0으로 나눌 수 없음</text></g><g transform="translate(525,180)"><rect width="390" height="280" rx="26" fill="#fff8eb" stroke="#ecd7aa"/><text x="195" y="50" text-anchor="middle" class="h">숫자 + 문자열</text><text x="35" y="105" class="code">age = 20</text><text x="35" y="145" class="code">print(age + "살")</text><text x="35" y="195" class="code err">TypeError</text><text x="35" y="240" class="b">int와 str을 바로 + 할 수 없음</text></g><g transform="translate(980,180)"><rect width="390" height="280" rx="26" fill="#f3f6ff" stroke="#ced9f0"/><text x="195" y="50" text-anchor="middle" class="h">= 와 == 혼동</text><text x="35" y="110" class="code">score = 85</text><text x="35" y="155" class="b">값 저장</text><text x="35" y="205" class="code">score == 85</text><text x="35" y="250" class="b">같은지 비교</text></g><rect x="130" y="515" width="1180" height="180" rx="30" fill="#f5f9ff" stroke="#c9d8ef"/><text x="190" y="570" class="h">디버깅 기본 순서</text><g transform="translate(195,610)"><circle cx="0" cy="0" r="23" fill="#2364d8"/><text x="0" y="8" text-anchor="middle" class="n">1</text><text x="38" y="8" class="b">결과 예상</text><circle cx="225" cy="0" r="23" fill="#2364d8"/><text x="225" y="8" text-anchor="middle" class="n">2</text><text x="263" y="8" class="b">직접 실행</text><circle cx="450" cy="0" r="23" fill="#2364d8"/><text x="450" y="8" text-anchor="middle" class="n">3</text><text x="488" y="8" class="b">오류 메시지 읽기</text><circle cx="735" cy="0" r="23" fill="#0d9488"/><text x="735" y="8" text-anchor="middle" class="n">4</text><text x="773" y="8" class="b">한 곳만 수정</text><circle cx="990" cy="0" r="23" fill="#0d9488"/><text x="990" y="8" text-anchor="middle" class="n">5</text><text x="1028" y="8" class="b">다시 실행</text></g><text x="720" y="755" text-anchor="middle" class="s">AI에게도 “수정 코드만 주지 말고 원인을 먼저 설명해 줘”라고 요청하세요.</text></svg>