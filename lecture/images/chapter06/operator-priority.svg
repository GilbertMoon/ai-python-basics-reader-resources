<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">연산 순서와 괄호</title><desc id="desc">파이썬 연산자의 기본 우선순위와 괄호로 의도를 명확히 만드는 방법</desc><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:27px;font-weight:700}.n{font-size:25px;font-weight:800;fill:#fff}</style><text x="720" y="78" text-anchor="middle" class="t">연산 순서가 헷갈리면 괄호를 사용합니다</text><text x="720" y="122" text-anchor="middle" class="s">모든 우선순위를 외우는 것보다 계산 의도를 명확히 쓰는 습관이 중요합니다</text><g transform="translate(100,185)"><rect width="230" height="110" rx="24" fill="#2364d8"/><circle cx="55" cy="55" r="28" fill="#fff" opacity=".2"/><text x="55" y="64" text-anchor="middle" class="n">1</text><text x="145" y="48" text-anchor="middle" class="h" fill="#fff">괄호</text><text x="145" y="82" text-anchor="middle" class="code" fill="#fff">( )</text></g><g transform="translate(380,185)"><rect width="230" height="110" rx="24" fill="#6c62ce"/><circle cx="55" cy="55" r="28" fill="#fff" opacity=".2"/><text x="55" y="64" text-anchor="middle" class="n">2</text><text x="145" y="48" text-anchor="middle" class="h" fill="#fff">거듭제곱</text><text x="145" y="82" text-anchor="middle" class="code" fill="#fff">**</text></g><g transform="translate(660,185)"><rect width="290" height="110" rx="24" fill="#0d9488"/><circle cx="55" cy="55" r="28" fill="#fff" opacity=".2"/><text x="55" y="64" text-anchor="middle" class="n">3</text><text x="175" y="48" text-anchor="middle" class="h" fill="#fff">곱셈 계열</text><text x="175" y="82" text-anchor="middle" class="code" fill="#fff">* / // %</text></g><g transform="translate(1000,185)"><rect width="230" height="110" rx="24" fill="#e49b27"/><circle cx="55" cy="55" r="28" fill="#fff" opacity=".2"/><text x="55" y="64" text-anchor="middle" class="n">4</text><text x="145" y="48" text-anchor="middle" class="h" fill="#fff">덧셈 계열</text><text x="145" y="82" text-anchor="middle" class="code" fill="#fff">+ -</text></g><path d="M330 240H370 M610 240H650 M950 240H990" stroke="#7a8aa7" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7a8aa7"/></marker></defs><rect x="130" y="365" width="520" height="260" rx="28" fill="#f5f8ff" stroke="#cad8f0"/><text x="390" y="418" text-anchor="middle" class="h">괄호가 없을 때</text><text x="390" y="485" text-anchor="middle" class="code">2 + 3 * 4</text><text x="390" y="540" text-anchor="middle" class="b">3 * 4 먼저 → 2 + 12</text><text x="390" y="590" text-anchor="middle" class="h">결과 14</text><rect x="790" y="365" width="520" height="260" rx="28" fill="#f2fbf8" stroke="#c2e0d7"/><text x="1050" y="418" text-anchor="middle" class="h">괄호가 있을 때</text><text x="1050" y="485" text-anchor="middle" class="code">(2 + 3) * 4</text><text x="1050" y="540" text-anchor="middle" class="b">2 + 3 먼저 → 5 * 4</text><text x="1050" y="590" text-anchor="middle" class="h">결과 20</text><text x="720" y="710" text-anchor="middle" class="s">복잡한 식은 괄호로 “무엇을 먼저 계산할지” 사람이 읽기 쉽게 표현하세요.</text></svg>