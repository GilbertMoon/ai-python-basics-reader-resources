<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><title id="title">비교와 논리 연산 흐름</title><desc id="desc">비교 연산자가 True False를 만들고 and or not으로 조건을 조합하는 흐름</desc><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:23px;font-weight:600}.code{font-family:Consolas,monospace;font-size:25px;font-weight:700}.true{fill:#0b8a72}.false{fill:#c55353}</style><text x="720" y="78" text-anchor="middle" class="t">비교 결과는 True 또는 False</text><text x="720" y="122" text-anchor="middle" class="s">비교 연산의 결과를 논리 연산자로 다시 조합할 수 있습니다</text><rect x="80" y="180" width="590" height="430" rx="28" fill="#f4f8ff" stroke="#c9d9f3"/><text x="375" y="235" text-anchor="middle" class="h">비교 연산자</text><text x="140" y="295" class="code">10 == 10</text><text x="500" y="295" class="code true">True</text><text x="140" y="345" class="code">10 != 3</text><text x="500" y="345" class="code true">True</text><text x="140" y="395" class="code">10 &gt; 3</text><text x="500" y="395" class="code true">True</text><text x="140" y="445" class="code">10 &lt; 3</text><text x="500" y="445" class="code false">False</text><text x="140" y="495" class="code">10 &gt;= 10</text><text x="500" y="495" class="code true">True</text><text x="140" y="545" class="code">3 &lt;= 10</text><text x="500" y="545" class="code true">True</text><rect x="770" y="180" width="590" height="430" rx="28" fill="#f3fbf8" stroke="#c4e2d9"/><text x="1065" y="235" text-anchor="middle" class="h">논리 연산자</text><text x="830" y="305" class="code">True and True</text><text x="1190" y="305" class="code true">True</text><text x="830" y="365" class="code">True and False</text><text x="1190" y="365" class="code false">False</text><text x="830" y="425" class="code">True or False</text><text x="1190" y="425" class="code true">True</text><text x="830" y="485" class="code">False or False</text><text x="1190" y="485" class="code false">False</text><text x="830" y="545" class="code">not True</text><text x="1190" y="545" class="code false">False</text><rect x="170" y="655" width="1100" height="100" rx="24" fill="#fff8e8" stroke="#ead49d"/><text x="720" y="698" text-anchor="middle" class="h">가장 먼저 구분할 것</text><text x="720" y="735" text-anchor="middle" class="b">값 저장은 =  ·  같은지 비교는 ==  ·  비교 결과는 bool(True/False)</text></svg>