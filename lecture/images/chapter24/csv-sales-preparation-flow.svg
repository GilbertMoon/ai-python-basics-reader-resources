<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">CSV 읽기와 매출 계산 준비 흐름</title>
<desc id="desc">orders.csv를 읽고 shape columns dtypes 결측값을 점검한 뒤 sales_amount를 만들고 한 행을 직접 검산하는 Chapter 24 준비 단계 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#14285f}.t{font-size:38px;font-weight:800}.s{font-size:22px;font-weight:700;fill:#52617e}.h{font-size:22px;font-weight:800}.b{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:600}.tag{font-size:17px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:14px;font-weight:700}</style>
<text x="70" y="88" class="t">분석 전에는 CSV 상태를 확인하고 계산 열을 만든 뒤 한 행을 검산합니다</text>
<text x="70" y="130" class="s">실행이 된다고 바로 믿지 말고 데이터 구조와 계산 결과를 먼저 확인합니다</text>
<rect x="60" y="190" width="300" height="270" rx="26" fill="#eef5ff" stroke="#7aa8f5" stroke-width="3"/>
<rect x="95" y="220" width="155" height="38" rx="19" fill="#2f6ecb"/><text x="172" y="247" text-anchor="middle" class="tag">1. CSV 읽기</text>
<text x="95" y="315" class="code">df = pd.read_csv(file_path)</text>
<text x="95" y="355" class="small">data/chapter24/orders.csv</text>
<text x="95" y="395" class="small">한 행 = 주문 한 건</text>
<text x="95" y="435" class="small">파일이 실제로 잘 읽혔는지 확인</text>
<line x1="360" y1="325" x2="410" y2="325" stroke="#4477d2" stroke-width="5"/><polygon points="410,325 390,312 390,338" fill="#4477d2"/>
<rect x="410" y="190" width="300" height="270" rx="26" fill="#fff8ef" stroke="#f0c262" stroke-width="3"/>
<rect x="445" y="220" width="165" height="38" rx="19" fill="#d89f2d"/><text x="527" y="247" text-anchor="middle" class="tag">2. 구조 점검</text>
<text x="445" y="305" class="code">df.shape</text>
<text x="445" y="340" class="code">list(df.columns)</text>
<text x="445" y="375" class="code">df.dtypes</text>
<text x="445" y="410" class="code">df.isna().sum()</text>
<text x="445" y="445" class="small">24행 × 9열 · city 결측 2건</text>
<line x1="710" y1="325" x2="760" y2="325" stroke="#d89f2d" stroke-width="5"/><polygon points="760,325 740,312 740,338" fill="#d89f2d"/>
<rect x="760" y="190" width="300" height="270" rx="26" fill="#eaf9f2" stroke="#42b883" stroke-width="3"/>
<rect x="795" y="220" width="170" height="38" rx="19" fill="#2ea66b"/><text x="880" y="247" text-anchor="middle" class="tag">3. 매출 열 생성</text>
<text x="795" y="315" class="code">df["sales_amount"] =</text>
<text x="795" y="350" class="code">df["price"] * df["quantity"]</text>
<text x="795" y="395" class="small">price = 상품 단가</text>
<text x="795" y="430" class="small">quantity = 주문 수량</text>
<line x1="1060" y1="325" x2="1110" y2="325" stroke="#2ea66b" stroke-width="5"/><polygon points="1110,325 1090,312 1090,338" fill="#2ea66b"/>
<rect x="1110" y="190" width="270" height="270" rx="26" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="1145" y="220" width="160" height="38" rx="19" fill="#7d63be"/><text x="1225" y="247" text-anchor="middle" class="tag">4. 한 행 검산</text>
<text x="1145" y="315" class="small">O001 · 키보드</text>
<text x="1145" y="350" class="small">45,000원 × 2개</text>
<text x="1145" y="385" class="small">= 90,000원</text>
<text x="1145" y="425" class="small">계산 열과 직접 대조</text>
<rect x="80" y="525" width="1280" height="185" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="120" y="570" class="h">판단과 검증을 함께 합니다</text>
<text x="120" y="620" class="b">결측값</text><text x="245" y="620" class="small">city 결측 2건은 이번 매출 질문을 방해하지 않으므로 원본 행을 바로 삭제하지 않습니다</text>
<text x="120" y="665" class="b">핵심 습관</text><text x="245" y="665" class="small">새 계산 열을 만든 직후 손으로 검산 가능한 한두 행을 직접 비교합니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">read_csv() → 구조 점검 → sales_amount 생성 → 한 행 검산 순서를 습관으로 만드세요</text>
</svg>