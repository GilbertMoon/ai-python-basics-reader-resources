<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">딕셔너리 키와 값 구조</title>
<desc id="desc">리스트의 위치 인덱스와 딕셔너리의 의미 있는 키 조회를 비교하고 키와 값의 쌍 구조를 설명하는 Chapter 13 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:29px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:25px;font-weight:700}.small{font-size:19px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">딕셔너리는 위치 번호보다 의미 있는 키로 값을 찾습니다</text>
<text x="70" y="135" class="s">키(key)는 이름표, 값(value)은 실제 데이터입니다</text>
<rect x="70" y="195" width="580" height="245" rx="28" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="3"/>
<rect x="110" y="225" width="120" height="40" rx="20" fill="#6d7b99"/><text x="170" y="253" text-anchor="middle" class="tag">리스트</text>
<text x="110" y="325" class="code">student = ["민수", 20, 85]</text>
<text x="110" y="382" class="code">student[0]</text><text x="345" y="382" class="b">→ "민수"</text>
<text x="110" y="420" class="small">0, 1, 2라는 위치의 의미를 따로 기억해야 합니다.</text>
<rect x="720" y="195" width="650" height="245" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="760" y="225" width="140" height="40" rx="20" fill="#2f6ecb"/><text x="830" y="253" text-anchor="middle" class="tag">딕셔너리</text>
<text x="760" y="315" class="code">student = {"name": "민수",</text>
<text x="760" y="355" class="code">           "age": 20, "score": 85}</text>
<text x="760" y="410" class="code">student["name"]</text><text x="1060" y="410" class="b">→ "민수"</text>
<rect x="90" y="510" width="1260" height="180" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<text x="130" y="560" class="h">키 : 값 쌍으로 읽기</text>
<text x="130" y="620" class="code">"name" : "민수"</text><text x="510" y="620" class="code">"age" : 20</text><text x="830" y="620" class="code">"score" : 85</text>
<text x="130" y="665" class="small">코드 자체에 값의 의미가 드러나므로 학생 정보, 상품 정보처럼 속성이 있는 데이터를 표현하기 좋습니다.</text>
<rect x="90" y="730" width="1260" height="50" rx="16" fill="#fffaf1"/>
<text x="720" y="763" text-anchor="middle" class="b">기억하기: 리스트는 위치로 찾고, 딕셔너리는 키로 찾습니다</text>
</svg>