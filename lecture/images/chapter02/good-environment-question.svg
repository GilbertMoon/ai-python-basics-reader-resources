<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">개발 환경 문제를 AI에게 잘 질문하는 방법</title><desc id="desc">막연한 설치 질문과 구체적인 환경 질문을 비교하고 좋은 질문에 포함할 정보를 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.title{font-size:58px;font-weight:850}.sub{font-size:28px;font-weight:700;fill:#4a5878}.head{font-size:36px;font-weight:850}.q{font-size:24px;font-weight:700}.item{font-size:25px;font-weight:800}.small{font-size:20px;font-weight:560;fill:#4a5878}.num{font-size:26px;font-weight:850;fill:#fff}.foot{font-size:32px;font-weight:850}</style>
<text x="720" y="82" text-anchor="middle" class="title">“설치가 안 돼요”보다 이렇게 질문하세요</text>
<text x="720" y="128" text-anchor="middle" class="sub">AI는 현재 상황을 알 수 없으므로 환경 정보를 함께 줘야 합니다</text>
<g transform="translate(70 190)">
 <rect x="0" y="0" width="575" height="350" rx="30" fill="#fff7f7" stroke="#e57373" stroke-width="3"/>
 <text x="287" y="65" text-anchor="middle" class="head" fill="#d65757">막연한 질문</text>
 <rect x="55" y="105" width="465" height="90" rx="24" fill="#ffffff" stroke="#f1b5b5" stroke-width="2"/>
 <text x="287" y="160" text-anchor="middle" class="q">“파이썬 설치가 안 돼요. 고쳐 주세요.”</text>
 <text x="287" y="235" text-anchor="middle" class="small">운영체제, 실행한 명령, 오류 메시지가 없음</text>
 <text x="287" y="278" text-anchor="middle" class="small">→ AI가 여러 가능성을 추측해야 함</text>
 <text x="287" y="320" text-anchor="middle" class="small">→ 답변이 길고 정확도가 낮아질 수 있음</text>
</g>
<g transform="translate(795 190)">
 <rect x="0" y="0" width="575" height="350" rx="30" fill="#f4fcfb" stroke="#0f9f98" stroke-width="3"/>
 <text x="287" y="65" text-anchor="middle" class="head" fill="#0f9f98">구체적인 질문</text>
 <rect x="45" y="100" width="485" height="155" rx="24" fill="#ffffff" stroke="#9fded9" stroke-width="2"/>
 <text x="70" y="140" class="q">Windows 11에서 Python을 설치했습니다.</text>
 <text x="70" y="176" class="q">PowerShell에서 python --version을 실행하면</text>
 <text x="70" y="212" class="q">[오류 문구]가 나옵니다. py --version은 됩니다.</text>
 <text x="287" y="300" text-anchor="middle" class="small">현재 상태 + 실행 명령 + 실제 오류 + 비교 결과가 있음</text>
</g>
<g transform="translate(120 595)">
 <circle cx="50" cy="42" r="30" fill="#2864dc"/><text x="50" y="51" text-anchor="middle" class="num">1</text><text x="95" y="50" class="item">환경</text><text x="95" y="82" class="small">Windows/macOS, VS Code 등</text>
 <circle cx="360" cy="42" r="30" fill="#0f9f98"/><text x="360" y="51" text-anchor="middle" class="num">2</text><text x="405" y="50" class="item">실행한 명령</text><text x="405" y="82" class="small">python --version</text>
 <circle cx="710" cy="42" r="30" fill="#2864dc"/><text x="710" y="51" text-anchor="middle" class="num">3</text><text x="755" y="50" class="item">오류 문구</text><text x="755" y="82" class="small">요약하지 말고 그대로 전달</text>
 <circle cx="1030" cy="42" r="30" fill="#0f9f98"/><text x="1030" y="51" text-anchor="middle" class="num">4</text><text x="1075" y="50" class="item">원하는 도움</text><text x="1075" y="82" class="small">원인 설명·다음 확인 단계</text>
</g>
<rect x="160" y="720" width="1120" height="65" rx="22" fill="#f7faff" stroke="#a8c1f6" stroke-width="2"/>
<text x="720" y="762" text-anchor="middle" class="foot">좋은 질문은 정답을 요구하기보다 “다음에 무엇을 확인할지” 묻습니다.</text>
</svg>