<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">파일 경로와 Path 구조</title>
<desc id="desc">상대 경로가 실행 위치에 따라 달라질 수 있음을 보여 주고 pathlib Path로 프로젝트 기준 경로를 만드는 Chapter 16 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:42px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:20px;font-weight:600}.code{font-family:Consolas,monospace;font-size:20px;font-weight:700}.small{font-size:17px;font-weight:600}.tag{font-size:19px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">파일 이름이 같아도 위치가 다르면 찾지 못할 수 있습니다</text>
<text x="70" y="135" class="s">상대 경로는 기준 위치가 중요하고, Path를 사용하면 프로젝트 구조를 명확하게 표현할 수 있습니다</text>
<rect x="70" y="195" width="560" height="430" rx="28" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="3"/>
<rect x="105" y="225" width="130" height="40" rx="20" fill="#6d7b99"/><text x="170" y="253" text-anchor="middle" class="tag">폴더 구조</text>
<text x="110" y="325" class="code">ai-python-basics-book/</text>
<text x="145" y="370" class="code">├── examples/chapter16/</text>
<text x="180" y="410" class="code">│   └── text_read.py</text>
<text x="145" y="455" class="code">└── data/chapter16/</text>
<text x="180" y="495" class="code">    └── memo.txt</text>
<text x="110" y="565" class="b">목표 파일</text><text x="250" y="565" class="code">data/chapter16/memo.txt</text>
<rect x="700" y="195" width="670" height="205" rx="28" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="735" y="225" width="130" height="40" rx="20" fill="#d85c5c"/><text x="800" y="253" text-anchor="middle" class="tag">상대 경로</text>
<text x="735" y="325" class="code">open("memo.txt")</text>
<text x="735" y="365" class="small">현재 파일을 찾는 기준 위치에 memo.txt가 없으면 FileNotFoundError가 날 수 있습니다</text>
<rect x="700" y="440" width="670" height="250" rx="28" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="735" y="470" width="130" height="40" rx="20" fill="#2fa66d"/><text x="800" y="498" text-anchor="middle" class="tag">Path 사용</text>
<text x="735" y="555" class="code">BASE_DIR = Path(__file__).resolve().parents[2]</text>
<text x="735" y="600" class="code">file_path = BASE_DIR / "data" / "chapter16" / "memo.txt"</text>
<text x="735" y="650" class="small">프로젝트 기준 위치에서 파일 경로를 단계별로 조립합니다</text>
<rect x="70" y="735" width="1300" height="45" rx="16" fill="#eef5ff"/>
<text x="720" y="765" text-anchor="middle" class="b">경로 오류가 나면 코드보다 먼저 실제 파일 이름·폴더 위치·실행 기준 위치를 확인합니다</text>
</svg>