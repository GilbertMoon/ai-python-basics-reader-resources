<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">with open과 파일 모드 흐름</title>
<desc id="desc">with open으로 텍스트 파일을 안전하게 열고 r w a 모드를 구분하며 읽기와 쓰기 흐름을 설명하는 Chapter 16 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:42px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:27px;font-weight:800}.b{font-size:20px;font-weight:600}.code{font-family:Consolas,monospace;font-size:21px;font-weight:700}.small{font-size:17px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">with open()으로 열고, 목적에 맞는 파일 모드를 선택합니다</text>
<text x="70" y="135" class="s">파일을 안전하게 닫아 주는 with와 읽기·쓰기·추가 모드를 함께 익힙니다</text>
<rect x="70" y="190" width="1300" height="195" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<text x="110" y="235" class="h">기본 구조</text>
<text x="110" y="295" class="code">with open("memo.txt", "r", encoding="utf-8") as file:</text>
<text x="150" y="340" class="code">content = file.read()</text>
<text x="850" y="295" class="b">파일 이름</text><text x="1020" y="295" class="b">모드</text><text x="1140" y="295" class="b">문자 인코딩</text>
<text x="850" y="340" class="small">블록이 끝나면 파일이 자동으로 닫힙니다</text>
<rect x="70" y="445" width="400" height="250" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="105" y="475" width="80" height="40" rx="20" fill="#2fa66d"/><text x="145" y="503" text-anchor="middle" class="tag">r</text>
<text x="105" y="565" class="h">읽기</text>
<text x="105" y="610" class="code">file.read()</text>
<text x="105" y="650" class="small">기존 파일 내용을 읽습니다</text>
<rect x="520" y="445" width="400" height="250" rx="26" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="555" y="475" width="80" height="40" rx="20" fill="#d85c5c"/><text x="595" y="503" text-anchor="middle" class="tag">w</text>
<text x="555" y="565" class="h">새로 쓰기</text>
<text x="555" y="610" class="code">file.write("내용")</text>
<text x="555" y="650" class="small">기존 내용이 있으면 덮어씁니다</text>
<rect x="970" y="445" width="400" height="250" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="1005" y="475" width="80" height="40" rx="20" fill="#d8a432"/><text x="1045" y="503" text-anchor="middle" class="tag">a</text>
<text x="1005" y="565" class="h">이어 쓰기</text>
<text x="1005" y="610" class="code">file.write("추가 내용")</text>
<text x="1005" y="650" class="small">기존 내용 뒤에 새 내용을 붙입니다</text>
<rect x="70" y="735" width="1300" height="45" rx="16" fill="#f7f9fc"/>
<text x="720" y="765" text-anchor="middle" class="b">기록을 보존하며 추가하려면 a · 새로 저장하려면 w · 읽기만 하려면 r</text>
</svg>