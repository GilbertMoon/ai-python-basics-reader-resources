<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">열 선택 조건 필터링 숫자 요약 결측값 확인 흐름</title>
<desc id="desc">DataFrame에서 한 열과 여러 열을 선택하고 조건식을 Boolean Series로 만들어 행을 필터링한 뒤 숫자 요약과 결측값을 확인하는 Chapter 21 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:38px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:17px;font-weight:600}.code{font-family:Consolas,monospace;font-size:17px;font-weight:700}.small{font-size:14px;font-weight:600}.tag{font-size:17px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">DataFrame은 열을 고르고 조건으로 행을 거른 뒤 숫자를 요약할 수 있습니다</text>
<text x="70" y="132" class="s">열 선택과 조건식은 Chapter 11·13의 리스트·딕셔너리와 Chapter 09의 비교식에서 이어집니다</text>
<rect x="70" y="195" width="300" height="275" rx="25" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="225" width="135" height="38" rx="19" fill="#2f6ecb"/><text x="172" y="252" text-anchor="middle" class="tag">열 선택</text>
<text x="105" y="320" class="code">df["price"]</text>
<text x="105" y="360" class="small">한 열 → Series</text>
<text x="105" y="410" class="code">df[["product", "price"]]</text>
<text x="105" y="450" class="small">여러 열 → DataFrame</text>
<line x1="370" y1="330" x2="420" y2="330" stroke="#4775d1" stroke-width="5"/><polygon points="420,330 400,317 400,343" fill="#4775d1"/>
<rect x="420" y="195" width="320" height="275" rx="25" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="455" y="225" width="135" height="38" rx="19" fill="#d8a432"/><text x="522" y="252" text-anchor="middle" class="tag">조건 만들기</text>
<text x="455" y="320" class="code">df["price"] &gt;= 50000</text>
<text x="455" y="370" class="small">각 행마다 True 또는 False 생성</text>
<text x="455" y="420" class="small">조건 결과는 Boolean Series</text>
<line x1="740" y1="330" x2="790" y2="330" stroke="#d8a432" stroke-width="5"/><polygon points="790,330 770,317 770,343" fill="#d8a432"/>
<rect x="790" y="195" width="300" height="275" rx="25" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="825" y="225" width="135" height="38" rx="19" fill="#2fa66d"/><text x="892" y="252" text-anchor="middle" class="tag">행 필터링</text>
<text x="825" y="320" class="code">df[condition]</text>
<text x="825" y="365" class="code">df[df["price"] &gt;= 50000]</text>
<text x="825" y="420" class="small">True인 행만 남김</text>
<line x1="1090" y1="330" x2="1140" y2="330" stroke="#2fa66d" stroke-width="5"/><polygon points="1140,330 1120,317 1120,343" fill="#2fa66d"/>
<rect x="1140" y="195" width="230" height="275" rx="25" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="1175" y="225" width="125" height="38" rx="19" fill="#7d64bd"/><text x="1237" y="252" text-anchor="middle" class="tag">요약</text>
<text x="1175" y="315" class="code">mean()</text>
<text x="1175" y="355" class="code">min() max()</text>
<text x="1175" y="395" class="code">describe()</text>
<text x="1175" y="435" class="small">숫자 열 요약</text>
<rect x="90" y="535" width="1260" height="165" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="580" class="h">결측값 확인은 분석 전에 함께 수행합니다</text>
<text x="130" y="630" class="code">df.isna().sum()</text>
<text x="370" y="630" class="small">→ 열마다 비어 있는 값의 개수 확인</text>
<text x="780" y="630" class="b">예제</text><text x="880" y="630" class="small">city 열에 결측값 1개</text>
<text x="130" y="670" class="small">필터링·평균·최댓값 같은 결과는 원본 데이터와 간단히 눈으로 대조해 검증하는 습관을 유지합니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">열 선택 → 조건식 → 행 필터링 → 숫자 요약 → 결측값 확인</text>
</svg>