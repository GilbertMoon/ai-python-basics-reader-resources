<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">pandas 설치와 Series DataFrame 관계</title>
<desc id="desc">가상환경에 pandas를 설치하고 pd 별칭으로 불러온 뒤 Series는 한 열, DataFrame은 여러 열이 모인 표로 이해하는 Chapter 21 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:25px;font-weight:800}.b{font-size:18px;font-weight:600}.code{font-family:Consolas,monospace;font-size:18px;font-weight:700}.small{font-size:15px;font-weight:600}.tag{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">pandas는 표 데이터를 편리하게 읽고 선택하고 요약하는 도구입니다</text>
<text x="70" y="132" class="s">파이썬 기초 위에 Series와 DataFrame이라는 표 데이터 구조를 사용합니다</text>
<rect x="70" y="190" width="400" height="250" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="220" width="150" height="38" rx="19" fill="#2f6ecb"/><text x="180" y="247" text-anchor="middle" class="tag">환경 준비</text>
<text x="105" y="315" class="code">python -m pip install pandas</text>
<text x="105" y="365" class="code">import pandas as pd</text>
<text x="105" y="415" class="small">현재 .venv와 VS Code 인터프리터 확인</text>
<line x1="470" y1="315" x2="535" y2="315" stroke="#4775d1" stroke-width="5"/><polygon points="535,315 515,302 515,328" fill="#4775d1"/>
<rect x="535" y="190" width="360" height="250" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="570" y="220" width="125" height="38" rx="19" fill="#d8a432"/><text x="632" y="247" text-anchor="middle" class="tag">Series</text>
<text x="570" y="310" class="h">한 개의 열</text>
<text x="570" y="360" class="code">df["score"]</text>
<text x="570" y="405" class="small">이름 하나로 열을 선택하면 보통 Series</text>
<line x1="895" y1="315" x2="960" y2="315" stroke="#d8a432" stroke-width="5"/><polygon points="960,315 940,302 940,328" fill="#d8a432"/>
<rect x="960" y="190" width="410" height="250" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="995" y="220" width="145" height="38" rx="19" fill="#2fa66d"/><text x="1068" y="247" text-anchor="middle" class="tag">DataFrame</text>
<text x="995" y="310" class="h">여러 열이 모인 표</text>
<text x="995" y="360" class="code">df[["name", "score"]]</text>
<text x="995" y="405" class="small">열 이름 리스트를 전달하면 결과도 DataFrame</text>
<rect x="90" y="515" width="1260" height="180" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="560" class="h">CSV 파일을 읽으면 DataFrame으로 시작합니다</text>
<text x="130" y="615" class="code">df = pd.read_csv("store_sales.csv")</text>
<text x="130" y="655" class="small">DataFrame에서 한 열을 선택하면 Series, 여러 열을 선택하면 DataFrame이라고 먼저 이해하면 충분합니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">pandas 설치 → import pandas as pd → CSV를 DataFrame으로 읽기 → 열을 Series 또는 DataFrame으로 선택</text>
</svg>