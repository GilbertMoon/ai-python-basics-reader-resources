<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">문자열 기본 연산 한눈에 보기</title><desc id="desc">문자열 생성, 연결, 반복, 길이 확인을 설명하는 Chapter 07 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:30px;font-weight:800}.b{font-size:24px;font-weight:600}.code{font-family:Consolas,monospace;font-size:30px;font-weight:700}.n{font-size:25px;font-weight:800;fill:#fff}</style>
<text x="72" y="90" class="t">문자열 기본 연산 한눈에 보기</text><text x="72" y="132" class="s">문자열은 만들고, 이어 붙이고, 반복하고, 길이를 확인할 수 있습니다.</text>
<rect x="72" y="190" width="300" height="430" rx="28" fill="#eef5ff" stroke="#9fc5ff" stroke-width="3"/><circle cx="118" cy="235" r="25" fill="#2368d8"/><text x="110" y="244" class="n">1</text><text x="158" y="246" class="h">문자열 만들기</text><text x="102" y="318" class="code">name = "Python"</text><text x="102" y="370" class="code">city = 'Seoul'</text><text x="102" y="440" class="b">따옴표 안의 값은</text><text x="102" y="477" class="b">문자열(str)입니다.</text><rect x="102" y="520" width="235" height="62" rx="14" fill="#fff"/><text x="124" y="560" class="code">"2026" → str</text>
<rect x="405" y="190" width="300" height="430" rx="28" fill="#eefbf7" stroke="#90dcc4" stroke-width="3"/><circle cx="451" cy="235" r="25" fill="#129b78"/><text x="443" y="244" class="n">2</text><text x="491" y="246" class="h">연결하기 +</text><text x="435" y="318" class="code">"Hello" + " Python"</text><rect x="435" y="353" width="240" height="68" rx="14" fill="#fff"/><text x="458" y="396" class="code">Hello Python</text><text x="435" y="477" class="b">문자열 + 문자열</text><text x="435" y="514" class="b">→ 이어 붙이기</text><text x="435" y="567" class="b">공백도 문자이므로</text><text x="435" y="604" class="b">필요하면 직접 넣습니다.</text>
<rect x="738" y="190" width="300" height="430" rx="28" fill="#fff7eb" stroke="#f6c66c" stroke-width="3"/><circle cx="784" cy="235" r="25" fill="#e89d19"/><text x="776" y="244" class="n">3</text><text x="824" y="246" class="h">반복하기 *</text><text x="768" y="318" class="code">"-" * 10</text><rect x="768" y="353" width="240" height="68" rx="14" fill="#fff"/><text x="813" y="396" class="code">----------</text><text x="768" y="477" class="b">문자열 * 정수</text><text x="768" y="514" class="b">→ 지정한 횟수만큼 반복</text><text x="768" y="567" class="b">구분선이나 반복 문구를</text><text x="768" y="604" class="b">만들 때 유용합니다.</text>
<rect x="1071" y="190" width="297" height="430" rx="28" fill="#f4f0ff" stroke="#bea9f3" stroke-width="3"/><circle cx="1117" cy="235" r="25" fill="#7857d6"/><text x="1109" y="244" class="n">4</text><text x="1157" y="246" class="h">길이 len()</text><text x="1101" y="318" class="code">len("Python")</text><rect x="1101" y="353" width="237" height="68" rx="14" fill="#fff"/><text x="1200" y="396" class="code">6</text><text x="1101" y="477" class="b">공백도 문자 1개로</text><text x="1101" y="514" class="b">계산합니다.</text><text x="1101" y="567" class="code">len("AI Python")</text><text x="1101" y="607" class="b">→ 9</text>
<rect x="72" y="664" width="1296" height="88" rx="22" fill="#132b63"/><text x="110" y="718" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:30px;font-weight:800;fill:white">학습 루프: 결과 예상 → 직접 실행 → 문자열 한 곳 변경 → 다시 실행 → 결과 비교</text>
</svg>