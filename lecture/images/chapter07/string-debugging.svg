<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">문자열 오류 읽기</title><desc id="desc">따옴표 오류, IndexError, TypeError를 점검하는 Chapter 07 디버깅 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:23px;font-weight:600}.code{font-family:Consolas,monospace;font-size:25px;font-weight:700}.n{font-size:24px;font-weight:800;fill:#fff}</style>
<text x="72" y="90" class="t">문자열 오류를 읽는 세 가지 질문</text><text x="72" y="132" class="s">오류를 없애기 전에 어떤 규칙이 깨졌는지 먼저 확인합니다.</text>
<rect x="72" y="190" width="400" height="390" rx="28" fill="#fff0f0" stroke="#ef9d9d" stroke-width="3"/><circle cx="118" cy="235" r="24" fill="#d94d4d"/><text x="110" y="243" class="n">1</text><text x="158" y="246" class="h">따옴표가 닫혔나?</text><text x="105" y="315" class="code">message = "Hello</text><text x="105" y="355" class="code">print(message)</text><text x="105" y="425" class="b">문자열의 끝을 찾지 못하면</text><text x="105" y="462" class="b">문법 오류가 발생합니다.</text><rect x="105" y="500" width="330" height="48" rx="12" fill="#fff"/><text x="127" y="532" class="b">확인: 시작·끝 따옴표 짝</text>
<rect x="520" y="190" width="400" height="390" rx="28" fill="#fff7eb" stroke="#f2c16a" stroke-width="3"/><circle cx="566" cy="235" r="24" fill="#e59a19"/><text x="558" y="243" class="n">2</text><text x="606" y="246" class="h">인덱스가 범위 안인가?</text><text x="553" y="315" class="code">word = "Python"</text><text x="553" y="355" class="code">print(word[10])</text><text x="553" y="425" class="b">존재하지 않는 위치를 요청하면</text><text x="553" y="462" class="b">IndexError가 발생합니다.</text><rect x="553" y="500" width="330" height="48" rx="12" fill="#fff"/><text x="575" y="532" class="b">확인: len()과 마지막 인덱스</text>
<rect x="968" y="190" width="400" height="390" rx="28" fill="#f4f0ff" stroke="#bba6f1" stroke-width="3"/><circle cx="1014" cy="235" r="24" fill="#7758d5"/><text x="1006" y="243" class="n">3</text><text x="1054" y="246" class="h">데이터형이 맞나?</text><text x="1001" y="315" class="code">age = 20</text><text x="1001" y="355" class="code">"나이: " + age</text><text x="1001" y="425" class="b">str과 int를 +로 직접 연결하면</text><text x="1001" y="462" class="b">TypeError가 발생합니다.</text><rect x="1001" y="500" width="330" height="48" rx="12" fill="#fff"/><text x="1023" y="532" class="b">확인: str() 또는 f-string</text>
<rect x="72" y="620" width="1296" height="132" rx="24" fill="#132b63"/><text x="108" y="665" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:27px;font-weight:800;fill:white">기본 디버깅 순서</text><text x="108" y="710" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:27px;font-weight:700;fill:white">결과 예상 → 직접 실행 → 오류 메시지 읽기 → 따옴표·인덱스·데이터형 확인 → 한 곳만 수정 → 다시 실행</text>
</svg>