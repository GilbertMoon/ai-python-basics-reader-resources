<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">try except else finally 실행 흐름</title>
<desc id="desc">try에서 예외 발생 여부에 따라 except 또는 else로 분기하고 finally가 마지막에 항상 실행되는 Chapter 17 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:40px;font-weight:800}.s{font-size:25px;font-weight:700;fill:#52617e}.h{font-size:27px;font-weight:800}.b{font-size:19px;font-weight:600}.code{font-family:Consolas,monospace;font-size:20px;font-weight:700}.small{font-size:16px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">try에서 시도하고, 예외 여부에 따라 흐름이 갈립니다</text>
<text x="70" y="132" class="s">except는 실패 대응, else는 성공 후 처리, finally는 마지막 정리 역할입니다</text>
<rect x="520" y="185" width="400" height="145" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="555" y="215" width="90" height="38" rx="19" fill="#2f6ecb"/><text x="600" y="242" text-anchor="middle" class="tag">try</text>
<text x="555" y="300" class="code">number = int(input(...))</text>
<line x1="620" y1="330" x2="365" y2="430" stroke="#d85c5c" stroke-width="5"/><polygon points="365,430 385,409 392,427" fill="#d85c5c"/>
<line x1="820" y1="330" x2="1075" y2="430" stroke="#2fa66d" stroke-width="5"/><polygon points="1075,430 1048,427 1055,409" fill="#2fa66d"/>
<text x="355" y="385" class="b">예외 발생</text><text x="1010" y="385" class="b">예외 없음</text>
<rect x="130" y="430" width="470" height="175" rx="26" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="165" y="460" width="120" height="38" rx="19" fill="#d85c5c"/><text x="225" y="487" text-anchor="middle" class="tag">except</text>
<text x="165" y="550" class="code">except ValueError:</text>
<text x="195" y="585" class="small">예상한 예외에 맞는 안내 또는 대응</text>
<rect x="840" y="430" width="470" height="175" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="875" y="460" width="100" height="38" rx="19" fill="#2fa66d"/><text x="925" y="487" text-anchor="middle" class="tag">else</text>
<text x="875" y="550" class="code">print(f"입력 성공: {number}")</text>
<text x="875" y="585" class="small">try에서 예외가 없을 때만 실행</text>
<line x1="365" y1="605" x2="610" y2="675" stroke="#6d7b99" stroke-width="4"/><line x1="1075" y1="605" x2="830" y2="675" stroke="#6d7b99" stroke-width="4"/>
<rect x="520" y="650" width="400" height="105" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="555" y="675" width="110" height="38" rx="19" fill="#d8a432"/><text x="610" y="702" text-anchor="middle" class="tag">finally</text>
<text x="690" y="703" class="b">성공·실패와 관계없이 마지막에 실행</text>
<text x="720" y="785" text-anchor="middle" class="small">처음에는 try-except만으로 시작하고, 필요한 경우에만 else와 finally를 추가합니다</text>
</svg>