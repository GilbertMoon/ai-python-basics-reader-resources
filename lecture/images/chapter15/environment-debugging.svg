<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">모듈과 가상환경 오류 디버깅 체크리스트</title>
<desc id="desc">ModuleNotFoundError가 발생했을 때 모듈 이름, 파일 위치, 패키지 설치 여부, Python 경로, VS Code 인터프리터를 순서대로 점검하는 Chapter 15 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:42px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:25px;font-weight:800}.b{font-size:19px;font-weight:600}.code{font-family:Consolas,monospace;font-size:19px;font-weight:700}.codeSmall{font-family:Consolas,monospace;font-size:16px;font-weight:700}.small{font-size:17px;font-weight:600}.n{font-size:21px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">ModuleNotFoundError는 파일 위치와 실행 환경을 함께 확인합니다</text>
<text x="70" y="135" class="s">설치 명령을 반복하기 전에 “어떤 Python이 실행 중인가?”부터 추적합니다</text>
<rect x="60" y="190" width="255" height="345" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<circle cx="105" cy="232" r="23" fill="#d85c5c"/><text x="105" y="239" text-anchor="middle" class="n">1</text><text x="145" y="240" class="h">이름 확인</text>
<text x="90" y="310" class="code">import requests</text>
<text x="90" y="365" class="small">오류 메시지의 모듈 이름과</text><text x="90" y="395" class="small">import 철자를 먼저 확인</text>
<rect x="335" y="190" width="255" height="345" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<circle cx="380" cy="232" r="23" fill="#d8a432"/><text x="380" y="239" text-anchor="middle" class="n">2</text><text x="420" y="240" class="h">위치 확인</text>
<text x="365" y="310" class="code">math_tools.py</text>
<text x="365" y="365" class="small">직접 만든 모듈이라면 현재</text><text x="365" y="395" class="small">폴더 구조와 파일 이름 확인</text>
<rect x="610" y="190" width="255" height="345" rx="24" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<circle cx="655" cy="232" r="23" fill="#2f6ecb"/><text x="655" y="239" text-anchor="middle" class="n">3</text><text x="695" y="240" class="h">설치 확인</text>
<text x="640" y="310" class="code">python -m pip show</text><text x="640" y="345" class="code">requests</text>
<text x="640" y="405" class="small">외부 패키지가 현재 환경에</text><text x="640" y="435" class="small">설치되어 있는지 확인</text>
<rect x="885" y="190" width="255" height="345" rx="24" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<circle cx="930" cy="232" r="23" fill="#2fa66d"/><text x="930" y="239" text-anchor="middle" class="n">4</text><text x="970" y="240" class="h">Python 확인</text>
<text x="915" y="310" class="code">sys.executable</text>
<text x="915" y="365" class="small">실행 중인 Python 경로에</text><text x="915" y="395" class="small">프로젝트 .venv가 있는지 확인</text>
<rect x="1160" y="190" width="220" height="345" rx="24" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<circle cx="1205" cy="232" r="23" fill="#8065c4"/><text x="1205" y="239" text-anchor="middle" class="n">5</text><text x="1245" y="240" class="h">VS Code</text>
<text x="1190" y="310" class="codeSmall">Select Interpreter</text>
<text x="1190" y="365" class="small">에디터도 같은 .venv를</text><text x="1190" y="395" class="small">선택했는지 확인</text>
<rect x="90" y="600" width="1260" height="135" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="645" class="h">DEBUG CHECKLIST</text>
<text x="130" y="690" class="b">1. import 이름 · 2. 파일 위치 · 3. pip show · 4. sys.executable · 5. VS Code Interpreter</text>
<rect x="90" y="765" width="1260" height="25" rx="10" fill="#eef5ff"/>
</svg>