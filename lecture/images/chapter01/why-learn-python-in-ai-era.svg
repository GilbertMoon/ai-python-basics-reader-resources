<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">왜 AI 시대에도 파이썬을 배워야 할까?</title>
<desc id="desc">AI 시대에 파이썬 기초가 필요한 네 가지 이유와 학습 목표를 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>
  text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a6b}
  .title{font-size:58px;font-weight:800}.sub{font-size:26px;font-weight:700;fill:#2563d9}
  .n{font-size:28px;font-weight:800;fill:#fff}.cardTitle{font-size:28px;font-weight:800}
  .body{font-size:20px;font-weight:500;fill:#253452}.footer{font-size:31px;font-weight:800}
</style>
<text x="720" y="88" text-anchor="middle" class="title">왜 AI 시대에도 파이썬을 배워야 할까?</text>
<line x1="310" y1="135" x2="590" y2="135" stroke="#d6e4ff" stroke-width="3"/>
<rect x="600" y="111" width="240" height="48" rx="24" fill="#1768d9"/>
<text x="720" y="144" text-anchor="middle" class="sub" fill="#fff" style="fill:#fff">Chapter 01 핵심 질문</text>
<line x1="850" y1="135" x2="1130" y2="135" stroke="#d6e4ff" stroke-width="3"/>

<g transform="translate(55,200)">
  <rect width="315" height="390" rx="24" fill="#f7faff" stroke="#2e6be6" stroke-width="3"/>
  <circle cx="44" cy="0" r="36" fill="#1768d9"/><text x="44" y="10" text-anchor="middle" class="n">01</text>
  <rect x="85" y="70" width="145" height="105" rx="12" fill="#eaf2ff" stroke="#1768d9" stroke-width="3"/>
  <text x="157" y="137" text-anchor="middle" font-size="52px" font-weight="800">&lt;/&gt;</text>
  <text x="157" y="230" text-anchor="middle" class="cardTitle">AI가 만든 코드 이해하기</text>
  <line x1="35" y1="260" x2="280" y2="260" stroke="#8fb4ff" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="157" y="305" text-anchor="middle" class="body">코드를 읽고 의미를</text><text x="157" y="334" text-anchor="middle" class="body">설명할 수 있어야 합니다.</text>
</g>
<g transform="translate(395,200)">
  <rect width="315" height="390" rx="24" fill="#f5fffd" stroke="#119c96" stroke-width="3"/>
  <circle cx="44" cy="0" r="36" fill="#119c96"/><text x="44" y="10" text-anchor="middle" class="n">02</text>
  <circle cx="157" cy="120" r="60" fill="none" stroke="#119c96" stroke-width="16"/><path d="M120 120 l24 25 48 -55" fill="none" stroke="#119c96" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="157" y="230" text-anchor="middle" class="cardTitle" style="fill:#0d7f7a">결과 검증하기</text>
  <line x1="35" y1="260" x2="280" y2="260" stroke="#77c9c5" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="157" y="305" text-anchor="middle" class="body">정답처럼 보여도 직접</text><text x="157" y="334" text-anchor="middle" class="body">실행하고 확인해야 합니다.</text>
</g>
<g transform="translate(735,200)">
  <rect width="315" height="390" rx="24" fill="#f7faff" stroke="#2e6be6" stroke-width="3"/>
  <circle cx="44" cy="0" r="36" fill="#1768d9"/><text x="44" y="10" text-anchor="middle" class="n">03</text>
  <path d="M120 75 l88 88 M208 75 l-88 88" stroke="#1768d9" stroke-width="22" stroke-linecap="round"/><circle cx="164" cy="119" r="30" fill="#fff" stroke="#1768d9" stroke-width="8"/>
  <text x="157" y="230" text-anchor="middle" class="cardTitle">수정하고 확장하기</text>
  <line x1="35" y1="260" x2="280" y2="260" stroke="#8fb4ff" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="157" y="305" text-anchor="middle" class="body">내 상황에 맞게 코드를</text><text x="157" y="334" text-anchor="middle" class="body">바꿀 수 있어야 합니다.</text>
</g>
<g transform="translate(1075,200)">
  <rect width="315" height="390" rx="24" fill="#f5fffd" stroke="#119c96" stroke-width="3"/>
  <circle cx="44" cy="0" r="36" fill="#119c96"/><text x="44" y="10" text-anchor="middle" class="n">04</text>
  <circle cx="157" cy="110" r="52" fill="#d8faf5" stroke="#119c96" stroke-width="7"/><path d="M143 96 q14 -20 28 0 q-4 18 -14 30 q-10 -12 -14 -30" fill="none" stroke="#119c96" stroke-width="7"/><line x1="143" y1="164" x2="171" y2="164" stroke="#119c96" stroke-width="8"/>
  <text x="157" y="230" text-anchor="middle" class="cardTitle" style="fill:#0d7f7a">문제 해결력 기르기</text>
  <line x1="35" y1="260" x2="280" y2="260" stroke="#77c9c5" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="157" y="305" text-anchor="middle" class="body">도구를 활용해 스스로</text><text x="157" y="334" text-anchor="middle" class="body">문제를 해결해야 합니다.</text>
</g>
<rect x="70" y="635" width="1300" height="110" rx="24" fill="#f4f8ff" stroke="#76a6ff" stroke-width="2"/>
<circle cx="145" cy="690" r="35" fill="#1768d9"/><path d="M127 690 l13 13 25 -29" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="703" class="footer">파이썬 학습의 목표 = 읽기 · 실행 · 수정 · 검증</text>
</svg>