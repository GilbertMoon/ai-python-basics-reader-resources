<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">좋은 AI 질문의 예</title><desc id="desc">막연한 질문과 구체적인 질문을 비교하고 좋은 질문에 필요한 네 가지 요소를 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.title{font-size:58px;font-weight:800}.sub{font-size:28px;font-weight:750;fill:#4a5878}.head{font-size:34px;font-weight:800}.q{font-size:24px;font-weight:700}.check{font-size:27px;font-weight:800}.small{font-size:20px;font-weight:550;fill:#4a5878}.num{font-size:26px;font-weight:800;fill:#fff}</style>
<text x="720" y="82" text-anchor="middle" class="title">좋은 AI 질문의 예</text>
<text x="720" y="126" text-anchor="middle" class="sub">막연한 질문보다 구체적인 질문이 더 좋은 답을 만듭니다</text>
<rect x="65" y="180" width="610" height="350" rx="28" fill="#fff7f6" stroke="#ee6a5d" stroke-width="3"/>
<text x="370" y="235" text-anchor="middle" class="head" style="fill:#e75c51">나쁜 질문</text>
<rect x="160" y="275" width="425" height="62" rx="28" fill="#fff" stroke="#f1b0aa" stroke-width="2"/><text x="372" y="315" text-anchor="middle" class="q">파이썬 알려줘</text>
<rect x="160" y="360" width="425" height="62" rx="28" fill="#fff" stroke="#f1b0aa" stroke-width="2"/><text x="372" y="400" text-anchor="middle" class="q">에러 고쳐줘</text>
<rect x="160" y="445" width="425" height="62" rx="28" fill="#fff" stroke="#f1b0aa" stroke-width="2"/><text x="372" y="485" text-anchor="middle" class="q">코드 짜줘</text>

<rect x="765" y="180" width="610" height="350" rx="28" fill="#f4fffc" stroke="#119c96" stroke-width="3"/>
<text x="1070" y="235" text-anchor="middle" class="head" style="fill:#0c8d87">좋은 질문</text>
<rect x="825" y="275" width="490" height="62" rx="28" fill="#fff" stroke="#81d5d1" stroke-width="2"/><text x="1070" y="303" text-anchor="middle" class="q">for문을 처음 배우는 학생에게</text><text x="1070" y="329" text-anchor="middle" class="q">쉬운 예제로 설명해 줘</text>
<rect x="825" y="360" width="490" height="62" rx="28" fill="#fff" stroke="#81d5d1" stroke-width="2"/><text x="1070" y="388" text-anchor="middle" class="q">이 오류가 왜 발생하는지</text><text x="1070" y="414" text-anchor="middle" class="q">원인부터 설명해 줘</text>
<rect x="825" y="445" width="490" height="62" rx="28" fill="#fff" stroke="#81d5d1" stroke-width="2"/><text x="1070" y="473" text-anchor="middle" class="q">완성 코드는 주지 말고</text><text x="1070" y="499" text-anchor="middle" class="q">다음 한 단계 힌트만 줘</text>

<rect x="65" y="575" width="1310" height="175" rx="26" fill="#f5f9ff" stroke="#4f83e8" stroke-width="2"/>
<rect x="505" y="550" width="430" height="55" rx="27" fill="#1768d9"/><text x="720" y="586" text-anchor="middle" font-size="30px" font-weight="800" fill="#fff" style="fill:#fff">좋은 질문 체크리스트</text>
<g transform="translate(120,635)"><circle r="30" fill="#1768d9"/><text x="0" y="10" text-anchor="middle" class="num">1</text><text x="55" y="0" class="check">상황</text><text x="55" y="32" class="small">나는 지금 어떤 상황인가?</text></g>
<g transform="translate(440,635)"><circle r="30" fill="#1768d9"/><text x="0" y="10" text-anchor="middle" class="num">2</text><text x="55" y="0" class="check">목표</text><text x="55" y="32" class="small">무엇을 배우고 싶은가?</text></g>
<g transform="translate(760,635)"><circle r="30" fill="#1768d9"/><text x="0" y="10" text-anchor="middle" class="num">3</text><text x="55" y="0" class="check">현재 코드</text><text x="55" y="32" class="small">코드·오류를 함께 보여 주기</text></g>
<g transform="translate(1080,635)"><circle r="30" fill="#1768d9"/><text x="0" y="10" text-anchor="middle" class="num">4</text><text x="55" y="0" class="check">원하는 도움</text><text x="55" y="32" class="small">설명·힌트·검토를 구체적으로</text></g>
</svg>