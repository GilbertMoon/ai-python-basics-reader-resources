<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">range 함수 범위 규칙</title><desc id="desc">range의 끝 값 제외 규칙과 시작 끝 간격 인수에 따른 숫자 범위를 설명하는 Chapter 10 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:56px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:27px;font-weight:700}.small{font-size:20px;font-weight:600}.tag{font-size:21px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">range()는 시작·끝·간격으로 반복 범위를 만듭니다</text>
<text x="70" y="135" class="s">가장 중요한 규칙: 끝 값은 포함하지 않습니다</text>
<rect x="70" y="195" width="400" height="260" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="225" width="120" height="38" rx="19" fill="#2f6ecb"/><text x="165" y="252" text-anchor="middle" class="tag">끝만 지정</text>
<text x="105" y="315" class="code">range(5)</text>
<text x="105" y="365" class="b">만들어지는 값</text>
<text x="105" y="410" class="code">0  1  2  3  4</text>
<rect x="520" y="195" width="400" height="260" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="555" y="225" width="155" height="38" rx="19" fill="#2fa66d"/><text x="632" y="252" text-anchor="middle" class="tag">시작·끝 지정</text>
<text x="555" y="315" class="code">range(1, 6)</text>
<text x="555" y="365" class="b">만들어지는 값</text>
<text x="555" y="410" class="code">1  2  3  4  5</text>
<rect x="970" y="195" width="400" height="260" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="1005" y="225" width="180" height="38" rx="19" fill="#d8a432"/><text x="1095" y="252" text-anchor="middle" class="tag">시작·끝·간격</text>
<text x="1005" y="315" class="code">range(2, 11, 2)</text>
<text x="1005" y="365" class="b">만들어지는 값</text>
<text x="1005" y="410" class="code">2  4  6  8  10</text>
<rect x="70" y="500" width="1300" height="110" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="2"/>
<text x="110" y="545" class="h">주의: 끝 값은 제외</text>
<text x="420" y="545" class="code">range(1, 5)</text>
<text x="700" y="545" class="b">→ 1, 2, 3, 4</text>
<text x="110" y="585" class="b">1부터 5까지 필요하다면</text>
<text x="420" y="585" class="code">range(1, 6)</text>
<rect x="70" y="655" width="1300" height="100" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="110" y="700" class="h">역순도 가능합니다</text>
<text x="420" y="700" class="code">range(5, 0, -1)</text>
<text x="850" y="700" class="b">→ 5, 4, 3, 2, 1</text>
<text x="110" y="735" class="small">범위를 예상한 뒤 실제 출력 결과와 비교하는 습관을 들이세요.</text>
</svg>