<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">문자열과 숫자 비교</title><desc id="desc">print 100과 print 문자열 100의 화면 출력은 같아 보여도 데이터 의미가 다름을 설명하는 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:34px;font-weight:800}.b{font-size:25px;font-weight:600}.code{font-family:Consolas,monospace;font-size:40px;font-weight:700}.big{font-size:44px;font-weight:800}</style>
<text x="720" y="82" text-anchor="middle" class="t">문자열과 숫자는 무엇이 다를까?</text><text x="720" y="130" text-anchor="middle" class="s">화면에 같은 100이 보여도 파이썬은 서로 다른 데이터로 이해합니다</text>
<rect x="90" y="190" width="585" height="430" rx="30" fill="#f3f7ff" stroke="#2563dc" stroke-width="3"/><text x="382" y="250" text-anchor="middle" class="h">숫자 100</text><rect x="155" y="285" width="455" height="95" rx="20" fill="#0e1730"/><text x="382" y="346" text-anchor="middle" class="code" fill="#fff">print(100)</text><text x="382" y="445" text-anchor="middle" class="big">출력: 100</text><text x="155" y="510" class="b">• 따옴표가 없습니다.</text><text x="155" y="550" class="b">• 파이썬은 숫자로 다룹니다.</text><text x="155" y="590" class="b" fill="#2563dc">• 이후 계산에 사용할 수 있습니다.</text>
<rect x="765" y="190" width="585" height="430" rx="30" fill="#eefbf9" stroke="#149c98" stroke-width="3"/><text x="1057" y="250" text-anchor="middle" class="h">문자열 "100"</text><rect x="830" y="285" width="455" height="95" rx="20" fill="#0e1730"/><text x="1057" y="346" text-anchor="middle" class="code" fill="#fff">print("100")</text><text x="1057" y="445" text-anchor="middle" class="big">출력: 100</text><text x="830" y="510" class="b">• 따옴표로 감싸져 있습니다.</text><text x="830" y="550" class="b">• 파이썬은 글자로 다룹니다.</text><text x="830" y="590" class="b" fill="#149c98">• 글자 연결 등의 작업에 사용합니다.</text>
<rect x="165" y="675" width="1110" height="85" rx="24" fill="#eef4ff"/><text x="720" y="710" text-anchor="middle" class="h">보이는 결과가 같아도 데이터의 의미는 다를 수 있습니다.</text><text x="720" y="744" text-anchor="middle" class="b">자세한 데이터형은 Chapter 05에서 이어서 배웁니다.</text>
</svg>