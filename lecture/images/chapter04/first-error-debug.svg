<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">처음 만나는 파이썬 오류 읽기</title><desc id="desc">따옴표, 괄호, 들여쓰기 오류를 관찰하고 메시지에서 단서를 찾는 기본 디버깅 흐름</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:25px;font-weight:700}.n{font-size:24px;font-weight:800;fill:#fff}</style>
<text x="720" y="80" text-anchor="middle" class="t">오류는 실패가 아니라 단서입니다</text><text x="720" y="128" text-anchor="middle" class="s">처음에는 “어디가 이상한지 관찰 → 실행 → 메시지 읽기 → 최소 수정” 순서로 접근합니다</text>
<rect x="80" y="185" width="395" height="260" rx="28" fill="#fff5f5" stroke="#d74b4b" stroke-width="3"/><text x="277" y="235" text-anchor="middle" class="h">따옴표 오류</text><rect x="110" y="270" width="335" height="82" rx="16" fill="#0e1730"/><text x="135" y="321" class="code" fill="#fff">print("Hello)</text><text x="118" y="395" class="b">문자열의 시작과 끝이</text><text x="118" y="425" class="b">짝을 이루는지 확인합니다.</text>
<rect x="523" y="185" width="395" height="260" rx="28" fill="#fff8ee" stroke="#e59a35" stroke-width="3"/><text x="720" y="235" text-anchor="middle" class="h">괄호 오류</text><rect x="553" y="270" width="335" height="82" rx="16" fill="#0e1730"/><text x="578" y="321" class="code" fill="#fff">print("Hello"</text><text x="561" y="395" class="b">여는 괄호와 닫는 괄호가</text><text x="561" y="425" class="b">모두 있는지 확인합니다.</text>
<rect x="966" y="185" width="395" height="260" rx="28" fill="#f3f7ff" stroke="#2563dc" stroke-width="3"/><text x="1163" y="235" text-anchor="middle" class="h">들여쓰기 오류</text><rect x="996" y="270" width="335" height="82" rx="16" fill="#0e1730"/><text x="1021" y="304" class="code" fill="#fff">print("A")</text><text x="1021" y="338" class="code" fill="#fff">    print("B")</text><text x="1004" y="395" class="b">필요한 이유 없이 코드 앞에</text><text x="1004" y="425" class="b">공백을 넣지 않습니다.</text>
<rect x="115" y="500" width="1210" height="205" rx="30" fill="#eefbf9" stroke="#149c98" stroke-width="3"/>
<circle cx="205" cy="565" r="28" fill="#149c98"/><text x="205" y="574" text-anchor="middle" class="n">1</text><text x="250" y="575" class="h">코드를 눈으로 관찰</text>
<circle cx="525" cy="565" r="28" fill="#149c98"/><text x="525" y="574" text-anchor="middle" class="n">2</text><text x="570" y="575" class="h">직접 실행</text>
<circle cx="785" cy="565" r="28" fill="#149c98"/><text x="785" y="574" text-anchor="middle" class="n">3</text><text x="830" y="575" class="h">오류 메시지에서 단서 찾기</text>
<circle cx="1115" cy="565" r="28" fill="#149c98"/><text x="1115" y="574" text-anchor="middle" class="n">4</text><text x="1160" y="575" class="h">한 곳만 수정</text>
<text x="720" y="654" text-anchor="middle" class="b">AI에게 질문할 때도 코드와 실제 오류 메시지를 함께 보내고, 정답보다 원인을 먼저 요청합니다.</text>
<rect x="250" y="738" width="940" height="48" rx="16" fill="#eef4ff"/><text x="720" y="770" text-anchor="middle" class="b">핵심: 오류 메시지를 없애는 것보다 오류를 읽는 습관을 먼저 만듭니다.</text>
</svg>