<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">print 한 줄 읽기</title><desc id="desc">print 함수, 괄호, 문자열의 역할을 설명하는 Chapter 04 인포그래픽</desc>
<rect width="1440" height="810" fill="#fff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:58px;font-weight:800}.s{font-size:28px;font-weight:700;fill:#52617e}.h{font-size:30px;font-weight:800}.b{font-size:24px;font-weight:600}.code{font-family:Consolas,monospace;font-size:46px;font-weight:700}.n{font-size:27px;font-weight:800;fill:#fff}</style>
<text x="720" y="80" text-anchor="middle" class="t">print() 한 줄 읽기</text><text x="720" y="128" text-anchor="middle" class="s">처음에는 외우기보다 코드의 모양과 역할을 연결합니다</text>
<rect x="205" y="185" width="1030" height="135" rx="28" fill="#0e1730"/><text x="720" y="270" text-anchor="middle" class="code" fill="#fff">print("Hello, Python!")</text>
<line x1="380" y1="325" x2="300" y2="415" stroke="#2563dc" stroke-width="5"/><line x1="560" y1="325" x2="720" y2="415" stroke="#149c98" stroke-width="5"/><line x1="835" y1="325" x2="1110" y2="415" stroke="#2563dc" stroke-width="5"/>
<rect x="80" y="420" width="390" height="245" rx="28" fill="#f3f7ff" stroke="#2563dc" stroke-width="3"/><circle cx="135" cy="475" r="30" fill="#2563dc"/><text x="135" y="485" text-anchor="middle" class="n">1</text><text x="180" y="485" class="h">print</text><text x="115" y="545" class="b">화면에 값을 보여 주는</text><text x="115" y="582" class="b">출력 기능의 이름입니다.</text><text x="115" y="625" class="b" fill="#2563dc">무엇을 할지 알려 줍니다.</text>
<rect x="525" y="420" width="390" height="245" rx="28" fill="#eefbf9" stroke="#149c98" stroke-width="3"/><circle cx="580" cy="475" r="30" fill="#149c98"/><text x="580" y="485" text-anchor="middle" class="n">2</text><text x="625" y="485" class="h">( ) 괄호</text><text x="560" y="545" class="b">출력할 값을 괄호 안에</text><text x="560" y="582" class="b">넣습니다.</text><text x="560" y="625" class="b" fill="#149c98">값이 들어가는 자리입니다.</text>
<rect x="970" y="420" width="390" height="245" rx="28" fill="#f3f7ff" stroke="#2563dc" stroke-width="3"/><circle cx="1025" cy="475" r="30" fill="#2563dc"/><text x="1025" y="485" text-anchor="middle" class="n">3</text><text x="1070" y="485" class="h">"Hello, Python!"</text><text x="1005" y="545" class="b">따옴표로 감싼 글자는</text><text x="1005" y="582" class="b">문자열로 다룹니다.</text><text x="1005" y="625" class="b" fill="#2563dc">화면에 보일 내용입니다.</text>
<rect x="180" y="704" width="1080" height="70" rx="22" fill="#eef4ff"/><text x="720" y="750" text-anchor="middle" class="h">핵심: 코드를 읽을 때 “기능 → 값 → 실행 결과”를 연결해 봅니다.</text>
</svg>