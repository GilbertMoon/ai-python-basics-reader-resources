<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">계산 열에서 그룹별 집계까지의 흐름</title>
<desc id="desc">price와 quantity로 sales_amount를 만들고 category로 groupby한 뒤 sum 또는 mean을 적용하고 정렬하는 Chapter 22 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:600}.tag{font-size:17px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:16px;font-weight:700}</style>
<text x="70" y="88" class="t">계산 열을 만들면 질문에 맞는 그룹별 집계를 이어서 수행할 수 있습니다</text>
<text x="70" y="132" class="s">행별 계산 → 같은 값끼리 묶기 → 합계·평균 → 큰 값부터 정렬 순서로 읽습니다</text>
<rect x="60" y="195" width="300" height="250" rx="25" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="95" y="225" width="125" height="38" rx="19" fill="#2f6ecb"/><text x="157" y="252" text-anchor="middle" class="tag">1. 계산 열</text>
<text x="95" y="320" class="code">df["sales_amount"] =</text>
<text x="95" y="355" class="code">df["price"] *</text>
<text x="95" y="390" class="code">df["quantity"]</text>
<line x1="360" y1="320" x2="405" y2="320" stroke="#4775d1" stroke-width="5"/><polygon points="405,320 385,307 385,333" fill="#4775d1"/>
<rect x="405" y="195" width="300" height="250" rx="25" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="440" y="225" width="130" height="38" rx="19" fill="#d8a432"/><text x="505" y="252" text-anchor="middle" class="tag">2. 그룹화</text>
<text x="440" y="325" class="code">df.groupby(</text>
<text x="440" y="360" class="code">  "category"</text>
<text x="440" y="395" class="code">)["sales_amount"]</text>
<line x1="705" y1="320" x2="750" y2="320" stroke="#d8a432" stroke-width="5"/><polygon points="750,320 730,307 730,333" fill="#d8a432"/>
<rect x="750" y="195" width="300" height="250" rx="25" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="785" y="225" width="125" height="38" rx="19" fill="#2fa66d"/><text x="847" y="252" text-anchor="middle" class="tag">3. 집계</text>
<text x="785" y="320" class="code">.sum()</text>
<text x="785" y="365" class="small">그룹 전체의 매출 규모</text>
<text x="785" y="410" class="code">.mean()</text>
<text x="900" y="410" class="small">한 건당 평균</text>
<line x1="1050" y1="320" x2="1095" y2="320" stroke="#2fa66d" stroke-width="5"/><polygon points="1095,320 1075,307 1075,333" fill="#2fa66d"/>
<rect x="1095" y="195" width="285" height="250" rx="25" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="1130" y="225" width="125" height="38" rx="19" fill="#7d64bd"/><text x="1192" y="252" text-anchor="middle" class="tag">4. 정렬</text>
<text x="1130" y="325" class="code">.sort_values(</text>
<text x="1130" y="360" class="code">  ascending=False</text>
<text x="1130" y="395" class="code">)</text>
<rect x="90" y="515" width="1260" height="180" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="560" class="h">건수와 합계는 같은 질문이 아닙니다</text>
<text x="130" y="610" class="code">df["category"].value_counts()</text><text x="500" y="610" class="small">→ 카테고리별 판매 기록 건수</text>
<text x="130" y="655" class="code">df.groupby("category")["sales_amount"].sum()</text><text x="690" y="655" class="small">→ 카테고리별 매출 금액 합계</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">계산 열 → groupby → 질문에 맞는 sum/mean → sort_values로 비교</text>
</svg>