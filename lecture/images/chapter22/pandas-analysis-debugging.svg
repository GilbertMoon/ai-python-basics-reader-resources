<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">pandas 분석 실수 디버깅 체크리스트</title>
<desc id="desc">열 이름 오타 계산 열 생성 순서 빈도와 합계 혼동 정렬 결과 저장 결측값 의미 결과 검증을 점검하는 Chapter 22 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:38px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:22px;font-weight:800}.b{font-size:16px;font-weight:600}.small{font-size:14px;font-weight:600}.code{font-family:Consolas,monospace;font-size:15px;font-weight:700}.n{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">분석 결과가 이상하면 문법보다 질문·열·계산·집계 기준부터 점검합니다</text>
<text x="70" y="132" class="s">실행 오류뿐 아니라 자연스러워 보이는 잘못된 분석 결과도 직접 검증해야 합니다</text>
<rect x="60" y="190" width="315" height="235" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<circle cx="100" cy="230" r="22" fill="#d85c5c"/><text x="100" y="237" text-anchor="middle" class="n">1</text><text x="140" y="238" class="h">열 이름·생성 순서</text>
<text x="95" y="300" class="code">KeyError: 'sales'</text>
<text x="95" y="340" class="small">df.columns로 실제 이름 확인</text>
<text x="95" y="380" class="small">sales_amount를 만들기 전에</text>
<text x="95" y="405" class="small">사용한 것은 아닌지 확인</text>
<rect x="400" y="190" width="315" height="235" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<circle cx="440" cy="230" r="22" fill="#d8a432"/><text x="440" y="237" text-anchor="middle" class="n">2</text><text x="480" y="238" class="h">건수 vs 합계</text>
<text x="435" y="300" class="code">value_counts()</text>
<text x="435" y="340" class="small">몇 건인가?</text>
<text x="435" y="375" class="code">groupby().sum()</text>
<text x="435" y="410" class="small">금액 합계가 얼마인가?</text>
<rect x="740" y="190" width="315" height="235" rx="24" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<circle cx="780" cy="230" r="22" fill="#2f6ecb"/><text x="780" y="237" text-anchor="middle" class="n">3</text><text x="820" y="238" class="h">정렬·결측값</text>
<text x="775" y="300" class="small">sort_values() 결과를</text>
<text x="775" y="330" class="small">새 변수에 저장했는가?</text>
<text x="775" y="375" class="small">fillna() 전에 빈 값의 의미를</text>
<text x="775" y="405" class="small">먼저 판단했는가?</text>
<rect x="1080" y="190" width="300" height="235" rx="24" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<circle cx="1120" cy="230" r="22" fill="#2fa66d"/><text x="1120" y="237" text-anchor="middle" class="n">4</text><text x="1160" y="238" class="h">결과 검증</text>
<text x="1115" y="300" class="small">원본 몇 행 직접 계산</text>
<text x="1115" y="335" class="small">필터 조건 만족 행 세기</text>
<text x="1115" y="370" class="small">AI 해석과 집계 기준 대조</text>
<text x="1115" y="405" class="small">저장 CSV도 다시 열어 확인</text>
<rect x="90" y="500" width="1260" height="205" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="545" class="h">AI에게 분석 검토를 요청할 때 함께 제공할 것</text>
<text x="130" y="595" class="b">분석 질문</text><text x="270" y="595" class="small">무엇을 알고 싶은가?</text>
<text x="540" y="595" class="b">계산 정의</text><text x="680" y="595" class="small">sales_amount = price × quantity</text>
<text x="1010" y="595" class="b">코드·결과</text><text x="1150" y="595" class="small">실제 출력</text>
<text x="130" y="645" class="small">완성 코드를 다시 만들게 하기보다 질문에 맞는 집계인지, 빠진 검증이 있는지, 결과 해석이 과장되지 않았는지 검토받습니다</text>
<text x="130" y="680" class="small">AI의 설명도 원본 데이터와 계산값으로 다시 확인해야 분석 결과를 자신의 판단으로 사용할 수 있습니다</text>
<rect x="90" y="745" width="1260" height="40" rx="14" fill="#eef5ff"/>
<text x="720" y="772" text-anchor="middle" class="b">열·계산 순서 → 집계 의미 → 정렬·결측 처리 → 원본과 결과 대조 → AI 해석 재검증</text>
