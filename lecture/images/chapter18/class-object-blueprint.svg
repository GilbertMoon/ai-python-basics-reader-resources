<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">클래스와 객체 설계도 관계</title>
<desc id="desc">클래스가 데이터와 기능을 정의하는 설계도이고 객체는 클래스로부터 만든 서로 다른 실제 값임을 설명하는 Chapter 18 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:40px;font-weight:800}.s{font-size:25px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:20px;font-weight:600}.code{font-family:Consolas,monospace;font-size:20px;font-weight:700}.small{font-size:17px;font-weight:600}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">클래스는 설계도이고, 객체는 그 설계도로 만든 실제 값입니다</text>
<text x="70" y="132" class="s">같은 클래스로 여러 객체를 만들 수 있지만 각 객체의 속성값은 서로 독립적입니다</text>
<rect x="90" y="190" width="520" height="400" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="125" y="225" width="130" height="40" rx="20" fill="#2f6ecb"/><text x="190" y="253" text-anchor="middle" class="tag">클래스</text>
<text x="125" y="325" class="h">Student 설계도</text>
<text x="125" y="380" class="code">속성: name, score</text>
<text x="125" y="425" class="code">메서드: show_result()</text>
<text x="125" y="470" class="code">메서드: is_passed()</text>
<text x="125" y="535" class="small">어떤 데이터와 기능을 가질지 미리 정의</text>
<line x1="610" y1="390" x2="760" y2="390" stroke="#4775d1" stroke-width="5"/><polygon points="760,390 740,377 740,403" fill="#4775d1"/>
<text x="685" y="360" text-anchor="middle" class="b">Student(...)</text>
<rect x="790" y="190" width="560" height="400" rx="28" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="825" y="225" width="130" height="40" rx="20" fill="#2fa66d"/><text x="890" y="253" text-anchor="middle" class="tag">객체</text>
<rect x="830" y="310" width="220" height="190" rx="22" fill="#ffffff" stroke="#c7ddf8" stroke-width="2"/>
<text x="860" y="350" class="h">student1</text>
<text x="860" y="405" class="code">name = "민수"</text>
<text x="860" y="450" class="code">score = 85</text>
<rect x="1090" y="310" width="220" height="190" rx="22" fill="#ffffff" stroke="#bde7d2" stroke-width="2"/>
<text x="1120" y="350" class="h">student2</text>
<text x="1120" y="405" class="code">name = "지영"</text>
<text x="1120" y="450" class="code">score = 92</text>
<text x="825" y="545" class="small">같은 설계도 · 서로 다른 실제 객체 · 각자 다른 속성값</text>
<rect x="90" y="650" width="1260" height="95" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="690" class="h">연결해서 기억하기</text>
<text x="430" y="690" class="b">함수는 기능을 묶고 · 클래스는 관련 데이터와 기능을 함께 묶고 · 객체는 그 구조를 실제 값으로 사용합니다</text>
<text x="720" y="730" text-anchor="middle" class="small">Student()를 호출할 때마다 새로운 객체가 만들어집니다</text>
</svg>