<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">AI에게 단계별 도움을 요청하는 방법</title>
<desc id="desc">현재 목표와 아는 것 시도한 것 막힌 점을 설명하고 완성 코드 대신 한 단계 힌트와 현재 수준 문법을 요청하는 Chapter 19 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:24px;font-weight:800}.b{font-size:18px;font-weight:600}.small{font-size:15px;font-weight:600}.tag{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">AI에게 정답 전체보다 “다음 한 걸음”을 요청합니다</text>
<text x="70" y="132" class="s">내 상황을 먼저 설명하면 학습 수준을 유지하면서 필요한 도움만 받을 수 있습니다</text>
<rect x="70" y="190" width="300" height="330" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="220" width="120" height="38" rx="19" fill="#2f6ecb"/><text x="165" y="247" text-anchor="middle" class="tag">STEP 1</text>
<text x="105" y="315" class="h">현재 목표</text>
<text x="105" y="355" class="small">카테고리별 합계를 계산하고 싶다</text>
<text x="105" y="410" class="h">내가 아는 것</text>
<text x="105" y="450" class="small">리스트 · 딕셔너리 · for문</text>
<rect x="405" y="190" width="300" height="330" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="440" y="220" width="120" height="38" rx="19" fill="#d8a432"/><text x="500" y="247" text-anchor="middle" class="tag">STEP 2</text>
<text x="440" y="315" class="h">시도한 것</text>
<text x="440" y="355" class="small">for문으로 지출을 하나씩 꺼냄</text>
<text x="440" y="410" class="h">막힌 지점</text>
<text x="440" y="450" class="small">합계를 어디에 누적할지 모르겠음</text>
<rect x="740" y="190" width="300" height="330" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="775" y="220" width="120" height="38" rx="19" fill="#2fa66d"/><text x="835" y="247" text-anchor="middle" class="tag">STEP 3</text>
<text x="775" y="315" class="h">원하는 도움</text>
<text x="775" y="355" class="small">완성 코드 대신 자료구조 힌트 1개</text>
<text x="775" y="410" class="h">설명 먼저</text>
<text x="775" y="450" class="small">코드보다 작동 순서를 먼저 요청</text>
<rect x="1075" y="190" width="295" height="330" rx="26" fill="#f3efff" stroke="#9b82d9" stroke-width="3"/>
<rect x="1110" y="220" width="120" height="38" rx="19" fill="#7d64bd"/><text x="1170" y="247" text-anchor="middle" class="tag">STEP 4</text>
<text x="1110" y="315" class="h">문법 수준 확인</text>
<text x="1110" y="355" class="small">배우지 않은 문법이 있는지 찾기</text>
<text x="1110" y="410" class="h">다시 요청</text>
<text x="1110" y="450" class="small">현재까지 배운 문법으로 설명</text>
<rect x="90" y="590" width="1260" height="135" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="635" class="h">좋은 요청의 핵심</text>
<text x="130" y="680" class="b">목표 + 내가 아는 것 + 시도한 것 + 막힌 점 + 원하는 도움의 크기</text>
<text x="130" y="710" class="small">AI가 더 짧은 고급 문법을 제안해도 이해하지 못한다면 그대로 사용하지 않고 현재 수준에 맞게 다시 설명해 달라고 요청합니다</text>
<rect x="90" y="750" width="1260" height="35" rx="14" fill="#eef5ff"/>
<text x="720" y="774" text-anchor="middle" class="b">생각을 AI에 넘기는 것이 아니라, 다음 한 걸음을 찾는 데 AI를 사용합니다</text>
</svg>