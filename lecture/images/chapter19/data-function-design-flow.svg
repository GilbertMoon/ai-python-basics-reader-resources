<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">데이터 모양과 함수 분해 설계 흐름</title>
<desc id="desc">지출 한 건을 딕셔너리로 여러 건을 리스트로 정하고 전체 합계 카테고리별 합계 보고서 함수로 나누는 Chapter 19 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:39px;font-weight:800}.s{font-size:24px;font-weight:700;fill:#52617e}.h{font-size:25px;font-weight:800}.b{font-size:18px;font-weight:600}.code{font-family:Consolas,monospace;font-size:18px;font-weight:700}.small{font-size:15px;font-weight:600}.tag{font-size:18px;font-weight:800;fill:#fff}</style>
<text x="70" y="88" class="t">데이터의 모양을 정하면 필요한 함수와 반복 처리 방식이 보입니다</text>
<text x="70" y="132" class="s">큰 프로그램을 한 번에 만들지 말고 데이터 구조와 기능을 작은 단위로 나눕니다</text>
<rect x="70" y="190" width="380" height="245" rx="26" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="105" y="220" width="135" height="38" rx="19" fill="#2f6ecb"/><text x="172" y="247" text-anchor="middle" class="tag">지출 1건</text>
<text x="105" y="315" class="code">{</text>
<text x="130" y="350" class="code">"date": "2026-08-01",</text>
<text x="130" y="385" class="code">"category": "식비",</text>
<text x="130" y="420" class="code">"amount": 12000</text>
<text x="430" y="330" class="h">→</text>
<rect x="485" y="190" width="390" height="245" rx="26" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<rect x="520" y="220" width="145" height="38" rx="19" fill="#2fa66d"/><text x="592" y="247" text-anchor="middle" class="tag">여러 지출</text>
<text x="520" y="315" class="code">expenses = [</text>
<text x="550" y="355" class="b">딕셔너리 1</text>
<text x="550" y="390" class="b">딕셔너리 2</text>
<text x="550" y="425" class="b">딕셔너리 3 ...</text>
<text x="855" y="330" class="h">→</text>
<rect x="910" y="190" width="460" height="245" rx="26" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<rect x="945" y="220" width="150" height="38" rx="19" fill="#d8a432"/><text x="1020" y="247" text-anchor="middle" class="tag">기능 분해</text>
<text x="945" y="320" class="code">calculate_total(expenses)</text>
<text x="945" y="365" class="code">calculate_by_category(...)</text>
<text x="945" y="410" class="code">show_report(...)</text>
<rect x="90" y="500" width="1260" height="175" rx="26" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="545" class="h">함수 내부를 다 쓰기 전에 이름과 역할부터 정합니다</text>
<text x="130" y="595" class="code">def calculate_total(expenses): pass</text>
<text x="520" y="595" class="code">def calculate_by_category(expenses): pass</text>
<text x="995" y="595" class="code">def show_report(...): pass</text>
<text x="130" y="640" class="small">각 함수가 한 가지 역할만 담당하는지 먼저 검토하고, 가장 단순한 함수 하나부터 구현합니다</text>
<rect x="90" y="720" width="1260" height="60" rx="18" fill="#eef5ff"/>
<text x="720" y="758" text-anchor="middle" class="b">데이터 모양 결정 → 함수 역할 나누기 → 함수 하나 구현 → 실행 확인 → 다음 기능으로 확장</text>
</svg>