<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img"><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#4d5d80}.h{font-size:29px;font-weight:800}.b{font-size:21px;font-weight:600;fill:#4d5d80}.n{font-size:27px;font-weight:800;fill:#fff}.code{font-family:Consolas,monospace;font-size:22px;fill:#eef5ff}</style><text x="720" y="82" text-anchor="middle" class="t">오류를 AI에게 질문할 때 포함할 정보</text><text x="720" y="128" text-anchor="middle" class="s">“에러가 났어요” 대신 AI가 문제를 재현할 수 있는 단서를 제공합니다</text><g transform="translate(70 185)"><rect width="310" height="180" rx="24" fill="#f5f8ff" stroke="#2364d8"/><circle cx="45" cy="48" r="25" fill="#2364d8"/><text x="45" y="57" text-anchor="middle" class="n">1</text><text x="90" y="58" class="h">목표</text><text x="35" y="112" class="b">무엇을 하려 했는가?</text><text x="35" y="145" class="b">원하는 동작을 한 문장으로</text></g><g transform="translate(405 185)"><rect width="310" height="180" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="45" cy="48" r="25" fill="#0d8f89"/><text x="45" y="57" text-anchor="middle" class="n">2</text><text x="90" y="58" class="h">코드</text><text x="35" y="112" class="b">문제가 생긴 코드를</text><text x="35" y="145" class="b">가능한 그대로 붙여넣기</text></g><g transform="translate(740 185)"><rect width="310" height="180" rx="24" fill="#fff7f5" stroke="#ea6a5a"/><circle cx="45" cy="48" r="25" fill="#ea6a5a"/><text x="45" y="57" text-anchor="middle" class="n">3</text><text x="90" y="58" class="h">오류 메시지</text><text x="35" y="112" class="b">요약하지 말고 터미널의</text><text x="35" y="145" class="b">실제 메시지를 함께 제공</text></g><g transform="translate(1075 185)"><rect width="295" height="180" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="45" cy="48" r="25" fill="#0d8f89"/><text x="45" y="57" text-anchor="middle" class="n">4</text><text x="90" y="58" class="h">기대 결과</text><text x="35" y="112" class="b">정상이라면 어떤 결과가</text><text x="35" y="145" class="b">나와야 하는가?</text></g><rect x="105" y="430" width="1230" height="210" rx="24" fill="#162441"/><text x="145" y="478" class="code">파이썬을 처음 배우고 있습니다.</text><text x="145" y="516" class="code">목표: Hello, Python!을 출력하고 싶습니다.</text><text x="145" y="554" class="code">코드: print("Hello, Python!"</text><text x="145" y="592" class="code">오류: SyntaxError ...</text><text x="145" y="630" class="code">수정 코드만 주지 말고, 원인을 먼저 설명해 주세요.</text><rect x="260" y="680" width="920" height="78" rx="20" fill="#eef5ff" stroke="#8fb4ff"/><text x="720" y="730" text-anchor="middle" class="h">환경 + 목표 + 코드 + 오류 + 기대 결과 + 원하는 도움을 함께 전달하세요</text></svg>