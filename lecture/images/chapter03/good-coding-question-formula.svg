<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img"><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#4d5d80}.n{font-size:28px;font-weight:800;fill:#fff}.h{font-size:27px;font-weight:800}.b{font-size:21px;font-weight:600;fill:#4d5d80}</style><text x="720" y="82" text-anchor="middle" class="t">좋은 코딩 질문의 6가지 구성 요소</text><text x="720" y="128" text-anchor="middle" class="s">질문을 길게 쓰는 것이 아니라, 필요한 정보를 빠뜨리지 않는 것이 핵심입니다</text><g transform="translate(70 185)"><rect width="390" height="180" rx="24" fill="#f5f8ff" stroke="#2364d8"/><circle cx="50" cy="52" r="27" fill="#2364d8"/><text x="50" y="62" text-anchor="middle" class="n">1</text><text x="95" y="62" class="h">나의 수준</text><text x="40" y="115" class="b">“파이썬을 처음 배우고 있습니다.”</text></g><g transform="translate(525 185)"><rect width="390" height="180" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="50" cy="52" r="27" fill="#0d8f89"/><text x="50" y="62" text-anchor="middle" class="n">2</text><text x="95" y="62" class="h">목표</text><text x="40" y="115" class="b">무엇을 만들거나 이해하고 싶은가?</text></g><g transform="translate(980 185)"><rect width="390" height="180" rx="24" fill="#f5f8ff" stroke="#2364d8"/><circle cx="50" cy="52" r="27" fill="#2364d8"/><text x="50" y="62" text-anchor="middle" class="n">3</text><text x="95" y="62" class="h">현재 상황</text><text x="40" y="115" class="b">어디까지 했고 어떤 환경인가?</text></g><g transform="translate(70 415)"><rect width="390" height="180" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="50" cy="52" r="27" fill="#0d8f89"/><text x="50" y="62" text-anchor="middle" class="n">4</text><text x="95" y="62" class="h">코드</text><text x="40" y="115" class="b">문제가 생긴 코드를 가능한 그대로</text></g><g transform="translate(525 415)"><rect width="390" height="180" rx="24" fill="#f5f8ff" stroke="#2364d8"/><circle cx="50" cy="52" r="27" fill="#2364d8"/><text x="50" y="62" text-anchor="middle" class="n">5</text><text x="95" y="62" class="h">실행 결과</text><text x="40" y="115" class="b">실제 출력값 또는 오류 메시지</text></g><g transform="translate(980 415)"><rect width="390" height="180" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="50" cy="52" r="27" fill="#0d8f89"/><text x="50" y="62" text-anchor="middle" class="n">6</text><text x="95" y="62" class="h">원하는 도움</text><text x="40" y="115" class="b">설명 · 힌트 · 원인 · 코드 검토</text></g><rect x="160" y="650" width="1120" height="95" rx="22" fill="#eef5ff" stroke="#8fb4ff"/><text x="720" y="710" text-anchor="middle" class="h">수준 + 목표 + 상황 + 코드 + 결과 + 원하는 도움 = AI가 추측할 부분을 줄이는 질문</text></svg>