<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img"><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#4d5d80}.h{font-size:28px;font-weight:800}.b{font-size:21px;font-weight:600;fill:#4d5d80}.n{font-size:27px;font-weight:800;fill:#fff}</style><text x="720" y="82" text-anchor="middle" class="t">정답 대신 단계별 힌트를 받는 학습 사다리</text><text x="720" y="128" text-anchor="middle" class="s">막혔다고 바로 완성 코드를 보지 말고, 필요한 만큼만 도움을 받습니다</text><g transform="translate(105 565)"><rect width="210" height="120" rx="24" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="25" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">1</text><text x="105" y="52" text-anchor="middle" class="h">혼자 생각</text><text x="105" y="88" text-anchor="middle" class="b">문제를 먼저 나눈다</text></g><g transform="translate(355 465)"><rect width="210" height="120" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="42" cy="40" r="25" fill="#0d8f89"/><text x="42" y="49" text-anchor="middle" class="n">2</text><text x="105" y="52" text-anchor="middle" class="h">힌트 1</text><text x="105" y="88" text-anchor="middle" class="b">첫 방향만 요청</text></g><g transform="translate(605 365)"><rect width="210" height="120" rx="24" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="25" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">3</text><text x="105" y="52" text-anchor="middle" class="h">다시 시도</text><text x="105" y="88" text-anchor="middle" class="b">내 코드로 적용</text></g><g transform="translate(855 265)"><rect width="210" height="120" rx="24" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="42" cy="40" r="25" fill="#0d8f89"/><text x="42" y="49" text-anchor="middle" class="n">4</text><text x="105" y="52" text-anchor="middle" class="h">힌트 2</text><text x="105" y="88" text-anchor="middle" class="b">필요할 때만 추가</text></g><g transform="translate(1105 165)"><rect width="210" height="120" rx="24" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="25" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">5</text><text x="105" y="52" text-anchor="middle" class="h">직접 실행</text><text x="105" y="88" text-anchor="middle" class="b">결과를 확인</text></g><path d="M315 625 L355 525 M565 525 L605 425 M815 425 L855 325 M1065 325 L1105 225" stroke="#86a8ef" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="310" y="700" width="820" height="70" rx="20" fill="#fff7e6" stroke="#efb649"/><text x="720" y="745" text-anchor="middle" class="h">마지막에 “내 코드가 맞는지 검토해 줘”라고 요청하면 학습 과정이 남습니다</text></svg>