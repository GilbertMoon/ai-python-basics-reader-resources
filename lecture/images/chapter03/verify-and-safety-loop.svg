<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img"><rect width="1440" height="810" fill="#fff"/><style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#13275f}.t{font-size:58px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#4d5d80}.h{font-size:27px;font-weight:800}.b{font-size:21px;font-weight:600;fill:#4d5d80}.n{font-size:27px;font-weight:800;fill:#fff}.warn{font-size:24px;font-weight:800;fill:#ba3a31}</style><text x="720" y="82" text-anchor="middle" class="t">AI 답변은 직접 검증하고, 민감한 정보는 제거합니다</text><text x="720" y="128" text-anchor="middle" class="s">자연스러운 설명도 실행과 확인을 거쳐야 내 코드가 됩니다</text><g transform="translate(70 190)"><rect width="215" height="120" rx="22" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="24" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">1</text><text x="110" y="48" text-anchor="middle" class="h">직접 실행</text><text x="110" y="86" text-anchor="middle" class="b">내 환경에서 실행</text></g><g transform="translate(335 190)"><rect width="215" height="120" rx="22" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="42" cy="40" r="24" fill="#0d8f89"/><text x="42" y="49" text-anchor="middle" class="n">2</text><text x="110" y="48" text-anchor="middle" class="h">결과 비교</text><text x="110" y="86" text-anchor="middle" class="b">원하는 결과인가?</text></g><g transform="translate(600 190)"><rect width="215" height="120" rx="22" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="24" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">3</text><text x="110" y="48" text-anchor="middle" class="h">값 바꾸기</text><text x="110" y="86" text-anchor="middle" class="b">다른 입력도 확인</text></g><g transform="translate(865 190)"><rect width="215" height="120" rx="22" fill="#f3fbfa" stroke="#0d8f89"/><circle cx="42" cy="40" r="24" fill="#0d8f89"/><text x="42" y="49" text-anchor="middle" class="n">4</text><text x="110" y="48" text-anchor="middle" class="h">낯선 문법</text><text x="110" y="86" text-anchor="middle" class="b">왜 필요한지 질문</text></g><g transform="translate(1130 190)"><rect width="215" height="120" rx="22" fill="#eef5ff" stroke="#2364d8"/><circle cx="42" cy="40" r="24" fill="#2364d8"/><text x="42" y="49" text-anchor="middle" class="n">5</text><text x="110" y="48" text-anchor="middle" class="h">다시 질문</text><text x="110" y="86" text-anchor="middle" class="b">필요한 부분만 수정</text></g><path d="M285 250H335 M550 250H600 M815 250H865 M1080 250H1130" stroke="#85a7ee" stroke-width="7"/><rect x="95" y="390" width="1250" height="285" rx="26" fill="#fff7f5" stroke="#ea6a5a"/><text x="720" y="448" text-anchor="middle" class="warn">AI에게 질문하기 전에 공유하면 안 되는 정보가 없는지 확인하세요</text><g transform="translate(180 495)"><rect width="230" height="105" rx="18" fill="#fff" stroke="#f0b2ab"/><text x="115" y="48" text-anchor="middle" class="h">비밀번호</text><text x="115" y="80" text-anchor="middle" class="b">YOUR_PASSWORD</text></g><g transform="translate(465 495)"><rect width="230" height="105" rx="18" fill="#fff" stroke="#f0b2ab"/><text x="115" y="48" text-anchor="middle" class="h">API 키 · 토큰</text><text x="115" y="80" text-anchor="middle" class="b">YOUR_API_KEY</text></g><g transform="translate(750 495)"><rect width="230" height="105" rx="18" fill="#fff" stroke="#f0b2ab"/><text x="115" y="48" text-anchor="middle" class="h">개인정보</text><text x="115" y="80" text-anchor="middle" class="b">예제 값으로 치환</text></g><g transform="translate(1035 495)"><rect width="230" height="105" rx="18" fill="#fff" stroke="#f0b2ab"/><text x="115" y="48" text-anchor="middle" class="h">내부 데이터</text><text x="115" y="80" text-anchor="middle" class="b">최소한만 공유</text></g><text x="720" y="735" text-anchor="middle" class="h">AI 답변 = 출발점 · 실행 결과와 테스트 = 최종 확인</text></svg>