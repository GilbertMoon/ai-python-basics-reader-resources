<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">AI Tutor 활용 흐름</title><desc id="desc">내 코드를 실행하고 오류를 정리한 뒤 AI에게 힌트를 요청하고 직접 수정하여 다시 검증하는 흐름</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a72}.s{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#374151}.n{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.b{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:700;fill:#143b7d}</style>
<text x="720" y="78" text-anchor="middle" class="t" font-size="58" font-weight="800">AI Tutor 활용 흐름</text>
<text x="720" y="122" text-anchor="middle" class="s" font-size="25">AI는 정답지가 아니라 개인 튜터입니다.</text>
<g transform="translate(250 165)">
<g><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">1</text><text x="120" y="57" class="b">내 코드 실행하기</text></g>
<path d="M470 88v28" stroke="#2f63df" stroke-width="5"/><path d="M458 106l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 116)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">2</text><text x="120" y="57" class="b">오류·질문 정리하기</text></g>
<path d="M470 204v28" stroke="#15958f" stroke-width="5"/><path d="M458 222l12 14 12-14" fill="none" stroke="#15958f" stroke-width="5"/>
<g transform="translate(0 232)"><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">3</text><text x="120" y="57" class="b">AI에게 힌트 요청하기</text></g>
<path d="M470 320v28" stroke="#2f63df" stroke-width="5"/><path d="M458 338l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 348)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">4</text><text x="120" y="57" class="b">답변을 검토하기</text></g>
<path d="M470 436v28" stroke="#15958f" stroke-width="5"/><path d="M458 454l12 14 12-14" fill="none" stroke="#15958f" stroke-width="5"/>
<g transform="translate(0 464)"><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">5</text><text x="120" y="57" class="b">내가 직접 수정하기</text></g>
<path d="M470 552v28" stroke="#2f63df" stroke-width="5"/><path d="M458 570l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 580)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">6</text><text x="120" y="57" class="b">다시 실행·검증하기</text></g>
</g>
<rect x="190" y="795" width="1060" height="72" rx="16" fill="#f8fbff" stroke="#b9cdfc"/><text x="720" y="840" text-anchor="middle" class="t" font-size="27" font-weight="700">완성 코드를 그대로 복사하지 말고, 힌트를 바탕으로 직접 수정하고 검증하세요.</text>
