<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">강의 도서 GitHub의 역할</title><desc id="desc">강의는 경험, 도서는 정리, GitHub는 실행을 담당하는 학습 구조</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a72}.s{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#374151}.h{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-weight:800}.item{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:27px;fill:#253858}</style>
<text x="720" y="78" text-anchor="middle" class="t" font-size="58" font-weight="800">강의 · 도서 · GitHub의 역할</text>
<text x="720" y="122" text-anchor="middle" class="s" font-size="25">세 가지를 함께 사용할 때 학습 효과가 가장 커집니다.</text>
<g transform="translate(70 190)">
<g><rect width="390" height="470" rx="28" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="195" cy="82" r="50" fill="#2f63df"/><text x="195" y="96" text-anchor="middle" fill="#fff" font-size="45">▶</text><text x="195" y="170" text-anchor="middle" class="h" font-size="42" fill="#1746ad">강의</text><line x1="55" y1="200" x2="335" y2="200" stroke="#93b1f5"/><text x="65" y="255" class="item">✓ 핵심 개념 이해</text><text x="65" y="315" class="item">✓ 라이브 코딩</text><text x="65" y="375" class="item">✓ 실습과 질문</text><text x="65" y="435" class="item">✓ AI 활용 경험</text></g>
<g transform="translate(455 0)"><rect width="390" height="470" rx="28" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="195" cy="82" r="50" fill="#15958f"/><text x="195" y="97" text-anchor="middle" fill="#fff" font-size="47">▤</text><text x="195" y="170" text-anchor="middle" class="h" font-size="42" fill="#0b7773">도서</text><line x1="55" y1="200" x2="335" y2="200" stroke="#9edbd6"/><text x="65" y="255" class="item">✓ 상세 설명</text><text x="65" y="315" class="item">✓ 추가 예제</text><text x="65" y="375" class="item">✓ 오류 해결</text><text x="65" y="435" class="item">✓ 복습과 Chapter Check</text></g>
<g transform="translate(910 0)"><rect width="390" height="470" rx="28" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="195" cy="82" r="50" fill="#2f63df"/><text x="195" y="98" text-anchor="middle" fill="#fff" font-size="42">&lt;/&gt;</text><text x="195" y="170" text-anchor="middle" class="h" font-size="42" fill="#1746ad">GitHub</text><line x1="55" y1="200" x2="335" y2="200" stroke="#93b1f5"/><text x="65" y="255" class="item">✓ 예제 코드</text><text x="65" y="315" class="item">✓ 실습 데이터</text><text x="65" y="375" class="item">✓ 직접 실행</text><text x="65" y="435" class="item">✓ 반복 연습</text></g>
</g>
<g transform="translate(150 710)"><rect width="330" height="90" rx="18" fill="#eef4ff" stroke="#2f63df"/><text x="165" y="38" text-anchor="middle" class="t" font-size="26" font-weight="800">강의 → 이해한다</text><text x="165" y="68" text-anchor="middle" class="s" font-size="19">경험의 시간</text></g>
<path d="M500 755h100" stroke="#2f63df" stroke-width="7"/><path d="M580 740l20 15-20 15" fill="none" stroke="#2f63df" stroke-width="7"/>
<g transform="translate(555 710)"><rect width="330" height="90" rx="18" fill="#effcf9" stroke="#15958f"/><text x="165" y="38" text-anchor="middle" fill="#0b7773" font-size="26" font-weight="800" font-family="Noto Sans KR,Malgun Gothic,sans-serif">도서 → 내 것으로 만든다</text><text x="165" y="68" text-anchor="middle" class="s" font-size="19">정리의 시간</text></g>
<path d="M905 755h100" stroke="#15958f" stroke-width="7"/><path d="M985 740l20 15-20 15" fill="none" stroke="#15958f" stroke-width="7"/>
<g transform="translate(960 710)"><rect width="330" height="90" rx="18" fill="#eef4ff" stroke="#2f63df"/><text x="165" y="38" text-anchor="middle" class="t" font-size="26" font-weight="800">GitHub → 직접 실행한다</text><text x="165" y="68" text-anchor="middle" class="s" font-size="19">실행의 공간</text></g>
<text x="720" y="860" text-anchor="middle" class="t" font-size="25" font-weight="700">강의는 경험의 시간, 도서는 정리의 시간, GitHub는 실행의 공간입니다.</text>
</svg>