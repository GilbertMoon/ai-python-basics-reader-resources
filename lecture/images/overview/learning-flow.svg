<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">이 강의의 학습 흐름</title><desc id="desc">보고 실행하기부터 스스로 작성하기까지 여섯 단계 학습 흐름</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#102a72}.s{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#374151}.n{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.b{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:36px;font-weight:700;fill:#143b7d}.small{font-size:24px}</style>
<text x="720" y="78" text-anchor="middle" class="t" font-size="58" font-weight="800">이 강의의 학습 흐름</text>
<text x="720" y="122" text-anchor="middle" class="s" font-size="25">실행하고, 예상하고, 바꾸고, 질문하고, 해결하며 배웁니다.</text>
<g transform="translate(250 165)">
<g><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">1</text><text x="120" y="57" class="b">보고 실행하기</text></g>
<path d="M470 88v28" stroke="#2f63df" stroke-width="5"/><path d="M458 106l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 116)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">2</text><text x="120" y="57" class="b">코드 바꿔 보기</text></g>
<path d="M470 204v28" stroke="#15958f" stroke-width="5"/><path d="M458 222l12 14 12-14" fill="none" stroke="#15958f" stroke-width="5"/>
<g transform="translate(0 232)"><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">3</text><text x="120" y="57" class="b">결과 예상하기</text></g>
<path d="M470 320v28" stroke="#2f63df" stroke-width="5"/><path d="M458 338l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 348)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">4</text><text x="120" y="57" class="b">AI에게 질문하기</text></g>
<path d="M470 436v28" stroke="#15958f" stroke-width="5"/><path d="M458 454l12 14 12-14" fill="none" stroke="#15958f" stroke-width="5"/>
<g transform="translate(0 464)"><rect width="940" height="88" rx="18" fill="#eef4ff" stroke="#2f63df" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#2f63df"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">5</text><text x="120" y="57" class="b">오류 해결하기</text></g>
<path d="M470 552v28" stroke="#2f63df" stroke-width="5"/><path d="M458 570l12 14 12-14" fill="none" stroke="#2f63df" stroke-width="5"/>
<g transform="translate(0 580)"><rect width="940" height="88" rx="18" fill="#effcf9" stroke="#15958f" stroke-width="2"/><circle cx="62" cy="44" r="31" fill="#15958f"/><text x="62" y="55" text-anchor="middle" class="n" font-size="32">6</text><text x="120" y="57" class="b">스스로 작성하기</text></g>
</g>
<rect x="190" y="795" width="1060" height="72" rx="16" fill="#f8fbff" stroke="#b9cdfc"/><text x="720" y="840" text-anchor="middle" class="t" font-size="27" font-weight="700">핵심은 정답을 복사하는 것이 아니라 직접 실행하고 검증하는 것입니다.</text>
</svg>