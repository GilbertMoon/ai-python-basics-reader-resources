<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">리스트 추가와 삭제 메서드 선택</title><desc id="desc">append insert extend remove pop del을 목적별로 구분해 설명하는 Chapter 11 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:21px;font-weight:600}.code{font-family:Consolas,monospace;font-size:24px;font-weight:700}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">리스트 메서드는 “무엇을 바꾸고 싶은가?”로 선택합니다</text>
<text x="70" y="135" class="s">추가할지, 지울지 먼저 결정하면 메서드 선택이 쉬워집니다</text>
<rect x="70" y="195" width="620" height="505" rx="28" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<rect x="110" y="225" width="120" height="40" rx="20" fill="#2f6ecb"/><text x="170" y="253" text-anchor="middle" class="tag">값 추가</text>
<text x="110" y="320" class="code">append(value)</text><text x="380" y="320" class="b">맨 뒤에 값 하나</text>
<line x1="110" y1="350" x2="645" y2="350" stroke="#c8d8ef" stroke-width="2"/>
<text x="110" y="410" class="code">insert(index, value)</text><text x="430" y="410" class="b">원하는 위치에 값 하나</text>
<line x1="110" y1="440" x2="645" y2="440" stroke="#c8d8ef" stroke-width="2"/>
<text x="110" y="500" class="code">extend(values)</text><text x="380" y="500" class="b">여러 값을 이어 붙임</text>
<rect x="110" y="565" width="535" height="95" rx="20" fill="#ffffff"/>
<text x="140" y="605" class="b">예: fruits.append("포도")</text><text x="140" y="640" class="b">→ 기존 리스트의 맨 뒤에 추가</text>
<rect x="750" y="195" width="620" height="505" rx="28" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<rect x="790" y="225" width="120" height="40" rx="20" fill="#d85c5c"/><text x="850" y="253" text-anchor="middle" class="tag">값 삭제</text>
<text x="790" y="320" class="code">remove(value)</text><text x="1060" y="320" class="b">값을 찾아 삭제</text>
<line x1="790" y1="350" x2="1325" y2="350" stroke="#eccaca" stroke-width="2"/>
<text x="790" y="410" class="code">pop(index)</text><text x="1060" y="410" class="b">위치로 삭제하고 값 반환</text>
<line x1="790" y1="440" x2="1325" y2="440" stroke="#eccaca" stroke-width="2"/>
<text x="790" y="500" class="code">del items[index]</text><text x="1090" y="500" class="b">위치로 바로 삭제</text>
<rect x="790" y="565" width="535" height="95" rx="20" fill="#ffffff"/>
<text x="820" y="605" class="b">주의: 없는 값을 remove()하면</text><text x="820" y="640" class="b">ValueError가 발생할 수 있습니다.</text>
<rect x="70" y="735" width="1300" height="45" rx="15" fill="#f7f9fc"/>
<text x="720" y="766" text-anchor="middle" class="b">추가: append / insert / extend · 삭제: remove / pop / del</text>
</svg>