<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">리스트 인덱스와 슬라이싱 구조</title><desc id="desc">리스트의 양수와 음수 인덱스, 첫 값과 마지막 값, 슬라이싱의 끝 값 제외 규칙을 설명하는 Chapter 11 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:22px;font-weight:600}.code{font-family:Consolas,monospace;font-size:27px;font-weight:700}.idx{font-size:21px;font-weight:800}.small{font-size:19px;font-weight:600}</style>
<text x="70" y="90" class="t">리스트는 순서가 있는 여러 값을 하나의 이름으로 관리합니다</text>
<text x="70" y="135" class="s">첫 번째 값은 [0], 마지막 값은 [-1]로 접근합니다</text>
<text x="70" y="205" class="code">fruits = ["사과", "바나나", "포도", "딸기"]</text>
<g>
<rect x="115" y="275" width="270" height="150" rx="24" fill="#eef5ff" stroke="#77a7f4" stroke-width="3"/>
<text x="250" y="340" text-anchor="middle" class="h">사과</text><text x="250" y="385" text-anchor="middle" class="idx">[0]  /  [-4]</text>
<rect x="430" y="275" width="270" height="150" rx="24" fill="#eaf9f1" stroke="#42b983" stroke-width="3"/>
<text x="565" y="340" text-anchor="middle" class="h">바나나</text><text x="565" y="385" text-anchor="middle" class="idx">[1]  /  [-3]</text>
<rect x="745" y="275" width="270" height="150" rx="24" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<text x="880" y="340" text-anchor="middle" class="h">포도</text><text x="880" y="385" text-anchor="middle" class="idx">[2]  /  [-2]</text>
<rect x="1060" y="275" width="270" height="150" rx="24" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<text x="1195" y="340" text-anchor="middle" class="h">딸기</text><text x="1195" y="385" text-anchor="middle" class="idx">[3]  /  [-1]</text>
</g>
<rect x="90" y="505" width="1260" height="115" rx="24" fill="#f7f9fc" stroke="#d8e1f0" stroke-width="2"/>
<text x="130" y="552" class="h">슬라이싱</text><text x="310" y="552" class="code">fruits[1:3]</text><text x="600" y="552" class="b">→ ["바나나", "포도"]</text>
<text x="130" y="595" class="small">문자열과 마찬가지로 시작 인덱스는 포함하고 끝 인덱스는 포함하지 않습니다.</text>
<rect x="90" y="670" width="1260" height="85" rx="22" fill="#eef5ff"/>
<text x="130" y="720" class="b">기억하기: 첫 값 [0] · 마지막 값 [-1] · 슬라이싱의 끝 위치는 제외</text>
</svg>