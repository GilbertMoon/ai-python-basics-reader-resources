<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">리스트 오류 디버깅 체크리스트</title><desc id="desc">리스트에서 자주 발생하는 IndexError와 ValueError, 인덱스 범위와 값 존재 여부를 점검하는 Chapter 11 인포그래픽</desc>
<rect width="1440" height="810" fill="#ffffff"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#12255f}.t{font-size:54px;font-weight:800}.s{font-size:27px;font-weight:700;fill:#52617e}.h{font-size:28px;font-weight:800}.b{font-size:21px;font-weight:600}.code{font-family:Consolas,monospace;font-size:23px;font-weight:700}.small{font-size:18px;font-weight:600}.n{font-size:22px;font-weight:800;fill:#fff}</style>
<text x="70" y="90" class="t">리스트 오류는 “위치”와 “값 존재 여부”부터 확인합니다</text>
<text x="70" y="135" class="s">오류 메시지가 다르면 먼저 확인할 질문도 달라집니다</text>
<rect x="70" y="195" width="620" height="370" rx="28" fill="#fff1f1" stroke="#e27676" stroke-width="3"/>
<circle cx="120" cy="240" r="26" fill="#d85c5c"/><text x="120" y="248" text-anchor="middle" class="n">1</text><text x="165" y="250" class="h">IndexError</text>
<text x="110" y="315" class="code">items = [10, 20, 30]</text><text x="110" y="360" class="code">print(items[3])</text>
<text x="110" y="425" class="b">확인 질문</text><text x="110" y="465" class="small">• len(items)는 몇 개인가?</text><text x="110" y="500" class="small">• 실제 마지막 인덱스는 몇 번인가?</text><text x="110" y="535" class="small">→ 길이 3이면 인덱스는 0, 1, 2까지</text>
<rect x="750" y="195" width="620" height="370" rx="28" fill="#fffaf1" stroke="#f0c25d" stroke-width="3"/>
<circle cx="800" cy="240" r="26" fill="#d8a432"/><text x="800" y="248" text-anchor="middle" class="n">2</text><text x="845" y="250" class="h">ValueError</text>
<text x="790" y="315" class="code">fruits = ["사과", "포도"]</text><text x="790" y="360" class="code">fruits.remove("바나나")</text>
<text x="790" y="425" class="b">확인 질문</text><text x="790" y="465" class="small">• 지우려는 값이 실제로 들어 있는가?</text><text x="790" y="500" class="small">• 먼저 "바나나" in fruits를 확인했는가?</text><text x="790" y="535" class="small">→ 없는 값을 remove()하면 ValueError</text>
<rect x="70" y="615" width="1300" height="125" rx="24" fill="#eef5ff" stroke="#c8d8ef" stroke-width="2"/>
<text x="110" y="660" class="h">DEBUG CHECKLIST</text>
<text x="110" y="705" class="b">1. len()으로 길이 확인 · 2. 인덱스 범위 확인 · 3. in으로 값 존재 확인 · 4. 한 번에 한 곳만 수정 후 재실행</text>
<rect x="70" y="765" width="1300" height="30" rx="12" fill="#f7f9fc"/>
</svg>